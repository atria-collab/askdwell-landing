age, sewer, trash and gas** as included in the utility\npassthrough, meaning tenants do not pay for them.\n\n> **Unresolved contradiction.** The same section then states that \"Electricity/Gas is not\n> included in the utility passthrough\" and that tenants set it up themselves via PG&E. Gas\n> therefore appears on both sides. This bundle records both statements rather than\n> choosing one. A property manager must resolve it. Recorded in the conversion review\n> reports.\n\n## Resident setup\n\nElectricity, and gas if it is in fact the resident's responsibility, is set up by the\nresident directly with [PG&E](/vendors/pge.md).\n\n## Shutoff locations\n\n| System | Location |\n| --- | --- |\n| Circuit breaker | On the wall at the back of the storage room |\n| Water shutoff | Inside the laundry room |\n\n## Meters\n\n| Meter | Location | Recorded |\n| --- | --- | --- |\n| Water | On the ground | 10/05/2024 |\n| Gas | On the wall on the left side of the building | 10/05/2024 |\n| PG&E smart meter | Inside the storage room | - |\n| Sewer | On the ground | 10/05/2024 |\n\n## Internet\n\nComcast Xfinity, AT&T and [Sonic](/vendors/sonic.md) are available. See\n[Utility and internet setup](/procedures/utility-and-internet-setup.md) for how the three\ncompare.\n\n## Related\n\n* [Amenities](/properties/berkeley/1742-spruce-street/amenities.md)\n* [Emergency and safety response](/procedures/emergency-response.md)", "properties/berkeley/1773-oxford/access-procedure": "This is the only property in the portfolio where resident access is issued **per person**\nrather than through a shared door code. That makes revocation possible - and makes the\nprogramming systems, rather than the doors, the thing to protect.\n\n## Entry points\n\n* Building entrances on the **south and west** sides, opened by resident **access cards**.\n* The **main entrance on the west side** also has a **Doorking** access system, so visitors\n  can call a resident's phone and be buzzed in without the resident coming down.\n* A **gate** with its own entry code.\n* **Bedroom doors can be locked from the inside but not from the outside.**\n\n## Fobs and phone credentials\n\n* Fobs are supplied by [August Jaye](/vendors/august-jaye-fob-supply.md).\n* The source records a fob programming web portal and a phone-credential assignment\n  procedure, both behind staff logins.\n* Backup key box contents recorded: one key per unit plus master fobs.\n* The trash room on the ground floor is opened by fob.\n\n## Key drop-off box\n\nThe **key to the electrical room** is in the key drop-off box by the side door, along with\nthe lock box key and cards. The drop-off box has its own code.\n\nA **MidState key lockbox in the backyard** holds the electric room key as well.\n\n## CCTV\n\nThe building **has cameras**. CCTV is supported by\n[Hue & Cry](/vendors/hue-and-cry.md) and viewed through the LTS Connect app under a staff\naccount.\n\n## Access points and secret references\n\n| Access point or system | Reference |\n| --- | --- |\n| Gate entry | `secret_ref: physical-access/1773-oxford/gate` |\n| South and west building entrances (cards) | `secret_ref: physical-access/1773-oxford/building-entrances` |\n| Roof access | `secret_ref: physical-access/1773-oxford/roof` |\n| Key drop-off box by the side door | `secret_ref: physical-access/1773-oxford/key-dropoff-box` |\n| MidState key lockbox, backyard | `secret_ref: physical-access/1773-oxford/backyard-midstate-lockbox` |\n| Electrical room | `secret_ref: physical-access/1773-oxford/electrical-room` |\n| Laundry rooms | `secret_ref: physical-access/1773-oxford/laundry-rooms` |\n| Package cabinet / parcel lockers | `secret_ref: physical-access/1773-oxford/package-cabinet` |\n| Fob programming portal | `secret_ref: account-credential/1773-oxford/fob-programming-portal` |\n| Phone credential assignment portal | `secret_ref: account-credential/1773-oxford/phone-credential-portal` |\n| External lock programming portal | `secret_ref: account-credential/1773-oxford/external-lock-portal` |\n| CCTV - LTS Connect app | `secret_ref: account-credential/1773-oxford/lts-connect-cctv` |\n| Doorking intercom programming | `secret_ref: account-credential/1773-oxford/doorking-intercom` |\n| Lobby iPad account | `secret_ref: account-credential/1773-oxford/lobby-ipad` |\n| AirWallet operator portal | `secret_ref: account-credential/1773-oxford/airwallet-operator-portal` |\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n* [Hue & Cry, Inc.](/vendors/hue-and-cry.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/1773-oxford/amenities": "## Laundry\n\n**Shared laundry rooms on every floor from 2F to 5F.** Each room has **1 washer and 2\ndryers**.\n\n* Payment through the [AirWallet](/vendors/airwallet.md) app - residents download it and\n  pay online\n* Residents supply their own detergent\n* Instruction printout samples: https://wiser.airwallet.net/en/category/marketing-material-yyhky2/\n\nLaundry revenue is connected to the operating bank account; account details are\ntransactional and are not stored in this bundle.\n\n## Bike storage\n\n**Bike racks are provided inside on each floor.**\n\n## Mail and packages\n\n* A mailbox unit in the **lobby on the first floor**; each unit has its own mail slot and\n  its own mailbox key.\n* **USPS packages** are left in the **parcel boxes within the mailbox unit**.\n* Package locker hardware documentation:\n  https://www.digilock.com/products/smart-locks/curve/\n* An iPad near the mailbox displays public commute information on Google Maps. It is\n  signed in to a staff account whose credential is protected.\n\n## Garbage\n\nThe **trash room is on the ground floor** and is accessible by **fob key**. Residents take\ntheir own trash there and separate garbage, recycling, cardboard and green waste.\n\n| Day | Streams |\n| --- | --- |\n| Monday | Recycling, cardboard |\n| Wednesday | Garbage, organics |\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov.\n\n## Common area service\n\nCleaned monthly by a community pro, covering common areas and landscaping.\nLandscaping is contracted to [Al Fresco Landscaping](/vendors/al-fresco-landscaping.md).\n\n## Related\n\n* [Package delivery access](/procedures/package-delivery-access.md)", "properties/berkeley/1773-oxford/inspections": "| Inspection | Inspector | Last recorded |\n| --- | --- | --- |\n| Elevator | [OTIS](/vendors/otis-elevator.md) | 05/2025, with monthly self-inspection required |\n| 3 standpipes, five-year renewal | [R2 Mechanical Inc.](/vendors/r2-mechanical.md) | 04/2025 |\n| Fire alarm, annual | [Hue & Cry, Inc.](/vendors/hue-and-cry.md) | 04/2025 |\n| Extinguisher, annual | [X-Extinguisher Service Co.](/vendors/x-extinguisher-service.md) | 04/2025 |\n| Sprinklers | [Thorpe Design](/vendors/thorpe-design.md) | 04/2025 |\n\n## Notes\n\n* Every row here carries both an inspector and a date - the only property in the portfolio\n  where that is true.\n* Unlike the other Berkeley properties, **no City of Berkeley fire safety inspection** is\n  recorded for this building. Whether that is a genuine gap or a record-keeping gap needs\n  a property manager's answer.\n* The monthly elevator self-inspection is an internal obligation and is not evidenced by a\n  vendor record.\n\n## Related\n\n* [Safety systems](/properties/berkeley/1773-oxford/safety-systems.md)", "properties/berkeley/1773-oxford/maintenance": "## Battery jump and change\n\nThe source records a battery jump and changing instruction for this property, and - unlike\nanywhere else in the portfolio - records **where the tools are**:\n\n> On the bottom right side of the package locker there is a screwdriver and a 9V battery.\n\nThe **door battery inspection schedule is marked TBD** in the source. See\n[Door battery replacement](/procedures/door-battery-replacement.md).\n\n## AC system behaviour\n\nTwo groups: floors 1-3 and floors 4-5. **If someone in a group turns on heating first,\nothers in that group cannot use cooling.** Resident reports of \"the AC does not work\"\nshould be checked against this before being treated as a fault.\n\n## Vendor roster\n\n| Trade | Vendor |\n| --- | --- |\n| Mechanical, standpipes | [R2 Mechanical Inc.](/vendors/r2-mechanical.md) |\n| Electrical | [Staggs Construction](/vendors/staggs-construction.md) |\n| Fire alarm monitoring, CCTV, external lock, intercom | [Hue & Cry, Inc.](/vendors/hue-and-cry.md) |\n| Fire sprinklers | [Thorpe Design](/vendors/thorpe-design.md) |\n| Landscaping | [Al Fresco Landscaping](/vendors/al-fresco-landscaping.md) |\n| Elevator | [OTIS](/vendors/otis-elevator.md) |\n| Fob supply | [August Jaye](/vendors/august-jaye-fob-supply.md) |\n| Fire extinguishers | [X-Extinguisher Service Co.](/vendors/x-extinguisher-service.md) |\n| Laundry payments | [AirWallet](/vendors/airwallet.md) |\n\n## Warranty\n\nThe source lists **roof**, **elevator** and **fire alarm system** as items with warranty\ncoverage, but records no warranty terms, dates or documents for any of them. Insurance\nclaim information is marked **TBD**.\n\n## Appliances\n\nPer-unit appliance records are kept in the source with no retrievable URLs. The source\nalso references furniture instructions as a bare link label with no URL.\n\n## Related\n\n* [Inspections](/properties/berkeley/1773-oxford/inspections.md)", "properties/berkeley/1773-oxford/property": "| Attribute | Value |\n| --- | --- |\n| Address | 1773 Oxford, Berkeley, California |\n| Units | 24 |\n| Year built | 2025 |\n| Amenities | On-site laundry on floors 2-5, bike racks on each floor, elevator, package lockers |\n| Parking | None. Residents cannot obtain a dedicated space |\n\n## Structure\n\nFive residential floors, numbered 101-104, 201-205, 301-305, 401-405 and 501-505.\n\nBuilding entrances are on the **south and west** sides and are opened by resident access\ncards. The main entrance on the west side also has a **Doorking** intercom so visitors can\ncall a resident's phone and be buzzed in.\n\n## Heating and cooling\n\n* Each unit has its own **ducted forced-air heating** system.\n* Each bedroom and common area has its own heating register.\n* One thermostat per unit.\n* **There is no cooling.**\n* There is **no gas connection**; the water heater is electric.\n\nThe AC system is split into **two groups: floors 1-3 and floors 4-5**. If someone in a\ngroup turns on heating first, others in that group cannot use cooling. This is a\nfrequent source of resident complaints and is a system constraint, not a fault.\n\n## Units\n\nTwenty-three units are individually numbered in the source; the property is stated to have\n24. See [units](/properties/berkeley/1773-oxford/units/index.md) for the identified units\nand for what is known about the unnumbered row.\n\n## Parking\n\nThere is no dedicated parking, and residents are not able to obtain a space. For the city\npermit process see\nhttps://berkeleyca.gov/city-services/parking/resident-parking-permits\n\n## Applicable jurisdiction\n\nBerkeley, California. See [Berkeley](/jurisdictions/california/berkeley/index.md).\n\n## Related\n\ eparately metered and billed to each unit**, and the lease covers the water\n  bills.\n\nThese statements come from different parts of the same source section and are recorded as\nwritten. A property manager should reconcile them before the bundle is relied on for\nbilling.\n\n## Heating\n\n* Ducted forced-air heating per unit\n* A heating register in each bedroom and common area\n* One thermostat per unit\n* **No cooling**\n\n## Shutoff locations\n\n| System | Location |\n| --- | --- |\n| Circuit breaker | In the electrical room |\n| Water shutoff | Outside room 102, on the right side when facing the building |\n\nThe electrical room key is itself behind a coded key drop-off box - see the\n[access procedure](/properties/berkeley/1773-oxford/access-procedure.md).\n\n## Internet\n\nResidents may buy their own service from **AT&T** or [Sonic](/vendors/sonic.md) and\ncontact the provider directly to set up an account. The source records a Sonic application\nlink offering a two-month free promotion, but records it as a bare link label with no\nretrievable URL, so no URL is reproduced.\n\nSonic account portal: https://members.sonic.net/account/billing/\n\n## Staff-held provider accounts\n\n| Account | Reference |\n| --- | --- |\n| [EBMUD](/vendors/ebmud.md) water account | `secret_ref: account-credential/1773-oxford/ebmud-account` |\n| [PG&E](/vendors/pge.md) projects portal, https://yourprojects-pge.com/login | `secret_ref: account-credential/1773-oxford/pge-projects-portal` |\n| [Sonic](/vendors/sonic.md) account portal | `secret_ref: account-credential/1773-oxford/sonic-account-portal` |\n| Building Wi-Fi management portal | `secret_ref: account-credential/1773-oxford/wifi-management-portal` |\n| Building Wi-Fi network | `secret_ref: account-credential/1773-oxford/wifi-network` |\n\n## Related\n\n* [Utility and internet setup](/procedures/utility-and-internet-setup.md)", "properties/berkeley/2340-hilgard-avenue/access-procedure": "## Entry points\n\nTwo stairwells: one outside directly in front of the property, and one about two thirds of\nthe way down the driveway on the left, next to the mailboxes.\n\n## Backup keys - nested arrangement\n\nThe backup keys sit behind two layers, and the order matters:\n\n1. Walk to the stairwell next to the mailboxes. To the **left of the mailboxes** is a\n   door. Open it and you face **three more doors**: left goes to unit B1, straight ahead\n   is the front door of unit B2, and **right goes to the closet**.\n2. On the **outside** of the closet door is a **grey key lock box**. Its combination opens\n   the box, which holds the key to the closet door.\n3. Inside the closet, **behind the door**, is the **red key lock box**, opened by its own\n   combination.\n\nThe closet also holds the timers controlling the outdoor lights and the network\nconnectivity boxes.\n\n## Access points and secret references\n\n| Access point | Reference |\n| --- | --- |\n| Building access code | `secret_ref: physical-access/2340-hilgard-avenue/main-entrance` |\n| Grey key lock box, outside the closet door | `secret_ref: physical-access/2340-hilgard-avenue/grey-key-lockbox` |\n| Red key lock box, inside the closet | `secret_ref: physical-access/2340-hilgard-avenue/red-key-lockbox` |\n| Mailbox combination locks | `secret_ref: physical-access/2340-hilgard-avenue/mailbox-combination-locks` |\n| Sonic building account portal | `secret_ref: account-credential/2340-hilgard-avenue/sonic-account-portal` |\n\n## Surveillance\n\nThe property has **no** camera or surveillance equipment.\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/2340-hilgard-avenue/amenities": "## Parking\n\n6 open-air spaces at **$150**. No garage key is required. The source names a \"Hilgard\nProperty / Parking Map\" but records no retrievable URL.\n\n## Laundry\n\n* 1 washer, 1 dryer\n* **Coin operated**\n* Equipment: GE Appliances, model GFQ14ESSN0WW\n* Machine IDs recorded: XPE-579 and HDT-403\n\nServiced by [CSC ServiceWorks](/vendors/csc-serviceworks.md), **who collect the coin\nrevenue themselves** - so the\n[laundry coin collection SOP](/procedures/laundry-coin-collection.md) does not apply here.\n\n## Mail\n\nMailboxes are next to the inside stairwell. Most use mail keys; some units may use a\ncombination-style lock. Combination values are protected and are not stored in this\nbundle.\n\nThe source records an identifier against \"Mailbox A\" whose meaning is not stated - it may\nbe a box number or a code. It has been treated as potentially protected and omitted.\n\n## Garbage\n\nTo the right of the property, behind parking spot 3 when facing the property from the\nstreet. Collected **Monday and Wednesday mornings**.\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov.\n\n## Common area service\n\n[Community Pro](/vendors/community-pro.md) cleans common areas and maintains the landscape\n**monthly**.\n\n## Related\n\n* [CSC ServiceWorks](/vendors/csc-serviceworks.md)", "properties/berkeley/2340-hilgard-avenue/inspections": "| Inspection | Inspector | Last rec y, AT&T and [Sonic](/vendors/sonic.md). Unit B-2 has a dedicated Sonic\nservice recorded against it. See\n[Utility and internet setup](/procedures/utility-and-internet-setup.md).\n\n## Related\n\n* [Amenities](/properties/berkeley/2340-hilgard-avenue/amenities.md)", "properties/berkeley/2421-2427-durant-avenue/access-procedure": "## Building access\n\n* **2421** - the left house. Units 2 and 3 can only be reached from the backyard.\n* **2423** - the house in the backyard.\n* **2425** - the right house's unit, reachable only from the backyard.\n* **2427** - the left house's unit, reachable through the front door of the right house.\n\nThe stair door at one of the Durant buildings shares its code with the gate door; the\nsource records which building, but the identifier sits inside a protected access line and\nhas not been separated out. Confirm with a property manager.\n\n## Backup keys\n\nThe backup key lockbox is in the **utility room in the backyard**, behind one of the\nbuildings, next to a numbered feature. The room itself is opened by a door code, and the\nblack lock box inside is opened by its own combination.\n\nA further backup key box room is recorded at 2425.\n\n## Storage rooms\n\nThree connected storage rooms in the backyard near 2423B. The first is the fuse storage\nroom and has its own combination; the second and third share one.\n\n## Access points and secret references\n\n| Access point | Reference |\n| --- | --- |\n| Gate door / building access code | `secret_ref: physical-access/durant-avenue/gate-door` |\n| Stair door | `secret_ref: physical-access/durant-avenue/stair-door` |\n| Backyard utility room door | `secret_ref: physical-access/durant-avenue/utility-room-door` |\n| Black lock box in the utility room | `secret_ref: physical-access/durant-avenue/utility-room-black-lockbox` |\n| Backup key box room, 2425 | `secret_ref: physical-access/durant-avenue/2425-backup-key-box-room` |\n| Red lockbox | `secret_ref: physical-access/durant-avenue/red-lockbox` |\n| Fuse storage room | `secret_ref: physical-access/durant-avenue/fuse-storage-room` |\n| Storage rooms 2 and 3 | `secret_ref: physical-access/durant-avenue/storage-rooms-2-3` |\n| Laundry room | `secret_ref: physical-access/durant-avenue/laundry-room` |\n\n## Surveillance\n\nThe buildings have **no** cameras or surveillance equipment.\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/2421-2427-durant-avenue/amenities": "## Parking\n\n**None.** For properties with no on-site parking, residents may apply for street parking\nwith the City. See\n[Berkeley resources](/jurisdictions/california/berkeley/tenant-resources.md).\n\n## Laundry\n\nThe laundry room is in the yard **between 2421 and 2423** (the pink house). With the\ngarbage area on your left, it is about ten feet away.\n\n* Payment by coin or the [PayRange](/vendors/payrange.md) mobile app\n* Equipment: GE Appliances, model GFQ14ESSN0WW\n* Service contact recorded in the source: 510-253-3656\n\nThe number of machines is recorded in the source on a line entangled with a protected\naccess value and could not be separated safely; it is not reproduced here.\n\nStaff collect the coins - see\n[Laundry coin collection](/procedures/laundry-coin-collection.md). The source records a\ncollection on 6/11/2026.\n\n## Mail\n\n| Building | Mailbox location |\n| --- | --- |\n| 2421 | To the right of the front door |\n| 2423 | Inside the gate to the backyard |\n| 2425 | Inside the gate to the backyard |\n| 2427 | To the left of the front door |\n\n## Storage\n\nIn the backyard near 2423B there are **three connected storage rooms**. The first is the\nfuse storage room; the second and third share a single combination. All three combinations\nare protected and are not stored in this bundle - see the\n[access procedure](/properties/berkeley/2421-2427-durant-avenue/access-procedure.md).\n\n## Garbage\n\nIn the backyard, behind the 2427 building. Collected **Tuesday and Friday mornings**.\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov. The city\nrefuse account number is a protected identifier and is not stored in this bundle.\n\n## Common area service\n\n[Community Pro](/vendors/community-pro.md), monthly.", "properties/berkeley/2421-2427-durant-avenue/inspections": "| Inspection | Inspector | Last recorded |\n| --- | --- | --- |\n| Fire safety | City of Berkeley Finance-Treasury Division, 510-981-7200 | Not recorded |\n| Pest inspection | n/a | n/a |\n| Standpipe, five-year renewal | N/A | N/A |\n| 1 fire alarm, annual | [Bay Alarm](/vendors/bay-alarm.md) | 01/2026 |\n| 7 extinguishers, annual | [Best Fire Equipment Company](/vendors/best-fire-equipment.md) | 01/2026 |\n| Sprinkler | N/A | N/A |\n| Fire monitoring fee | [Bay Alarm](/vendors/bay-alarm.md) | 01/2026 |\n\n## Notes\n\n* No date is recorded for the fire safety inspection.\n* The fire alarm row covers building 2427 only - the other three buildings have no alarm\n  system. See [safety systems](/properties/berkeley/2421-2427-durant-avenue/safety-systems.md).\n\n## Related\n\n n the street |\n\n## Boilers\n\n| Building | Location |\n| --- | --- |\n| 2421 | Left side of the building, near the black gate |\n| 2423 | Underneath the small enclosure next to the gas meter; open the small access panel to reach it |\n| 2425 | Recorded in the source with a location whose text is entangled with a protected access reference; not reproduced here |\n\n## Internet\n\nComcast, Xfinity, AT&T and [Sonic](/vendors/sonic.md). See\n[Utility and internet setup](/procedures/utility-and-internet-setup.md).\n\n## Related\n\n* [Maintenance](/properties/berkeley/2421-2427-durant-avenue/maintenance.md)", "properties/berkeley/2521-regent-street/access-procedure": "## Entry points\n\nAccess is **only** through the main entrance, opened by an access code.\n\n## Vertical access\n\n* Front stairwell - from the entrance to every floor, and on to the roof (maintenance\n  access only).\n* Back stairwell - every floor plus the garage.\n* Elevator - all floors including the garage.\n\n**Roof.** The key that unlocks the rooftop access door on the fourth floor is kept in the\nbackup key box.\n\n## Cameras\n\nThis building **does** have cameras. Recordings are viewed from the cabinet in the garage;\ninstructions for viewing are inside that cabinet.\n\n## Keys in the garage cabinet\n\nThe garage key and the two-car garage key are kept in a cabinet in the main garage. The\ncabinet is secured by an orange padlock with its own combination.\n\n## Reaching the separate two-car garage\n\nThe source records this route:\n\n1. Enter the building through the gate using the gate code.\n2. Go upstairs, then take the elevator down to the garage.\n3. Open the cabinet using the orange padlock combination and take the two-car garage key.\n4. Facing the building from the street, the metal gate about six feet to the right of the\n   main gate takes that key, as does the side door beside it.\n5. Bring items through the side door, or open the main garage door. The garage door motor\n   may need to be plugged in or switched on; a button just inside the door operates the\n   door itself.\n6. **Reverse every step**: lock everything and return the key to the cabinet where it was\n   found.\n\n## Access points and secret references\n\n| Access point | Reference |\n| --- | --- |\n| Main entrance | `secret_ref: physical-access/2521-regent-street/main-entrance` |\n| Backup key box | `secret_ref: physical-access/2521-regent-street/backup-key-box` |\n| Garage cabinet orange padlock | `secret_ref: physical-access/2521-regent-street/garage-cabinet-padlock` |\n| Garage key drop-off box | `secret_ref: physical-access/2521-regent-street/garage-key-dropoff` |\n| Elevator machine room | `secret_ref: physical-access/2521-regent-street/elevator-room` |\n| Package drop box | `secret_ref: physical-access/2521-regent-street/package-drop-box` |\n| Main garage storage closets | `secret_ref: physical-access/2521-regent-street/garage-storage-closets` |\n| Laundry room | `secret_ref: physical-access/2521-regent-street/laundry-room` |\n| Red box (garage) | `secret_ref: physical-access/2521-regent-street/garage-red-box` |\n| Mailbox combination locks | `secret_ref: physical-access/2521-regent-street/mailbox-combination-locks` |\n\n## Spare keys\n\nThe source records a \"Process for Obtaining Spare Keys\" heading whose content is entangled\nwith protected values and is not reproduced here. Follow\n[Key handling](/procedures/key-handling.md) and confirm the property-specific steps with a\nproperty manager.\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Package delivery access](/procedures/package-delivery-access.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/2521-regent-street/amenities": "## Parking\n\n11 spaces at **$150**. The garage key is kept in the cabinet in the garage. The source\nnames a parking map but records no retrievable URL.\n\nThere is also a **separate two-car garage** reached through a metal gate about six feet to\nthe right of the main gate when facing the building from the street; the same key works\nfor that gate and the adjacent side door. The retrieval procedure for that key is in the\n[access procedure](/properties/berkeley/2521-regent-street/access-procedure.md).\n\n## Laundry\n\n* 2 washers, 2 dryers\n* **Coin operated**\n* Equipment models: VYX 250 and WHY 400\n\nServiced by [WASH](/vendors/wash-laundry.md), **who collect the money and repair the\nmachines**, so the\n[laundry coin collection SOP](/procedures/laundry-coin-collection.md) does not apply here.\n\n## Mail and packages\n\nMailboxes are to the right, inside the front door. Most use mail keys; some units may use\na combination-style lock.\n\nA **grey package drop box** stands in front of the entrance, opened by a protected code.\n\n## Storage\n\nMain garage closets, opened by a protected code.\n\n## Garbage\n\nLocated to the left of the property, inside.\n\n| Stream | Day |\n| --- | --- |\n| Trash | Monday and Friday |\n| Food waste / compost | Tuesday |\n| Fiber | Tuesday |\n\nThe source lists \"Compost: Tuesday\" twice under separate headings; treated here as one\nTuesday compost collection.\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov. The city\nrefuse account number is a protected identifier and is not stored in this bundle.\n\n## Common area service\n\n[Community Pro](/vendors/community-pro.md), monthly.\n\n## Elevator\n\n[Paramount Elevator](/vendors/paramount-elevator.md), inspected monthly.", "properties/berkeley/2521-regent-street/inspections": "| Inspection | Inspector | Last recorded |\n| --- | --- | --- |\n| Fire safety | City of Berkeley Finance-Treasury Division, 510-981-7200 | Not recorded |\n| Elevator | [Paramount Elevator](/vendors/paramount-elevator.md), 510-864-1025 | Monthly maintenance; permit expired, renewal pending with the City of Berkeley |\n| 8 standpipes, five-year renewal | [Fire King Fire Protection](/vendors/fire-king-fire-protection.md) | 01/2026 |\n| 1 fire alarm, annual | [Bay Alarm](/vendors/bay-alarm.md) | 07/2026 |\n| 8 extinguishers, annual | [Best Fire Equipment Company](/vendors/best-fire-equipment.md) | 01/2026 |\n\n## Notes\n\n* No date is recorded for the fire safety inspection.\n* The expired elevator permit is the one open compliance item at this property.\n\n## Related\n\n* [Safety systems](/properties/berkeley/2521-regent-street/safety-systems.md)", "properties/berkeley/2521-regent-street/maintenance": "## Repair history\n\n| Work | Year |\n| --- | --- |\n| Smart locks installed | 2023 |\n\n## Elevator\n\n[Paramount Elevator](/vendors/paramount-elevator.md) performs maintenance monthly.\n\n**Open compliance item:** the source records that the elevator permit has expired and the\nproperty is waiting on the City of Berkeley to renew it. Confirm the current status before\nrelying on this - the record may be stale.\n\n## Recurring maintenance\n\n* **Door batteries** - inspected every time a tenant moves out. See\n  [Door battery replacement](/procedures/door-battery-replacement.md).\n* **Common areas and landscape** - [Community Pro](/vendors/community-pro.md), monthly.\n\n## Pest control\n\n[Pest Control Contractor](/vendors/pest-control-contractor.md), 925-788-3614.\n\n## Warranty\n\nNo warranty information is recorded for installed items; the source marks this n/a.\n\n## Equipment locations\n\n| Equipment | Location |\n| --- | --- |\n| Electrical distribution | In the garage, next to parking spot H |\n| Boiler room | Between parking spots C and D |\n| Garage cabinet holding keys and camera viewing instructions | Main garage |\n\n## Appliances\n\nPer-unit appliance label records are kept in the source; a missing label photo means the\nlong-term label application is unclear or missing. No retrievable URLs.\n\n## Related\n\n* [Inspections](/properties/berkeley/2521-regent-street/inspections.md)", "properties/berkeley/2521-regent-street/property": "| Attribute | Value |\n| --- | --- |\n| Address | 2521 Regent Street, Berkeley, California |\n| Units | 21 |\n| Year built | 1965 |\n| Amenities | Secure parking, on-site laundry, elevator, balconies/patios on most units |\n| Parking spaces | 11, at $150 |\n\n## Structure\n\nTwo stairwells: one directly in front as you enter, one at the back. The building has an\n**elevator serving all floors including the garage**. The back stairwell also reaches the\ngarage. The front stairwell reaches the roof, which is accessed for maintenance only.\n\n## Units\n\nTwenty-one units numbered 1-12 and 14-22. **There is no unit 13.** Sizes are one- and\ntwo-bedroom, all with one bathroom.\nSee [units](/properties/berkeley/2521-regent-street/units/index.md).\n\n## Ownership\n\nThe source records an owner name and personal email address for this property. Owner\npersonal contact details are not operational property knowledge and are not reproduced\nhere.\n\n## Applicable jurisdiction\n\nBerkeley, California. See [Berkeley](/jurisdictions/california/berkeley/index.md).\n\n## Related\n\n* [Utilities](/properties/berkeley/2521-regent-street/utilities.md)\n* [Access procedure](/properties/berkeley/2521-regent-street/access-procedure.md)\n* [Safety systems](/properti oto, VR-tour and floor-plan entries for units at this property as the bare word \"link\" or as a filename with no retrievable URL. No usable URL exists, so none is recorded here.\n\n## Access\n\nUnit access, backup keys and any protected codes are covered by [the property access procedure](/properties/berkeley/2521-regent-street/access-procedure.md). No credential value is stored in this bundle.\n\n## Related\n\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/index.md) - parent property\n* [All units at 2521 Regent Street](/properties/berkeley/2521-regent-street/units/index.md)", "properties/berkeley/2521-regent-street/utilities": "## What is included\n\n**Water, garbage and sewer** are in the utility passthrough. **Electricity is not** -\nresidents set up their own [PG&E](/vendors/pge.md) account.\n\nThe building's water heater runs on **gas** and is located in the garage.\n\n## Shutoff locations\n\n| System | Location |\n| --- | --- |\n| Electricity | In the garage, next to parking spot H |\n| Water shutoff | Same location as the electrical shutoff |\n\n## Meters and plant\n\n| Equipment | Location |\n| --- | --- |\n| Water meter | In the garage, next to parking spot H |\n| Gas meter | In the garage, next to parking spot H |\n| PG&E smart meter | In the garage, next to parking spot H |\n| Electrical distribution | In the garage, next to parking spot H |\n| Boiler room | Between parking spots C and D |\n| Sewer | On the street |\n\nParking spot H is effectively this building's utility hub - four of the six entries above\nsit there.\n\n## Internet\n\nComcast, Xfinity, AT&T and [Sonic](/vendors/sonic.md). See\n[Utility and internet setup](/procedures/utility-and-internet-setup.md).", "properties/berkeley/2712-derby-street/access-procedure": "## Entry points\n\nThe front door is opened by a code. Two stairwells: one near the main entrance, one at the\nback of the building.\n\n**Roof access: none.**\n\n## Backup keys\n\nThe backup keys are reached through the **boiler room, Room C**. The room is opened by one\ncode; the **red lock box** inside it is opened by another.\n\n## Basement storage\n\nEach unit has an associated basement storage access value recorded in the source's unit\ntable. All of those values are protected and are not stored in this bundle.\n\n## Mailbox combinations\n\nMailbox combinations follow a per-unit scheme. The values are protected. At least one has\nbeen changed by a resident since being set, so the scheme cannot be assumed to hold for\nevery box.\n\n## Access points and secret references\n\n| Access point | Reference |\n| --- | --- |\n| Front door | `secret_ref: physical-access/2712-derby-street/main-entrance` |\n| Boiler room, Room C | `secret_ref: physical-access/2712-derby-street/boiler-room-c` |\n| Red lock box in Room C | `secret_ref: physical-access/2712-derby-street/red-lockbox` |\n| Basement storage, per unit | `secret_ref: physical-access/2712-derby-street/basement-storage` |\n| Mailbox combination locks | `secret_ref: physical-access/2712-derby-street/mailbox-combination-locks` |\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/2712-derby-street/amenities": "## Parking\n\n**None on site.** Residents may apply for street parking with the City. See\n[Berkeley resources](/jurisdictions/california/berkeley/tenant-resources.md).\n\n## Laundry\n\n**In unit.** Every unit is recorded with a washer and dryer. There is no shared laundry\nroom and no payment method.\n\nThe source records a laundry service contact and equipment model at this property\n(510-253-3656, GE Appliances GFQ14ESSN0WW) despite the laundry being in-unit; the\nrelationship is not explained.\n\n## Mail\n\nMailboxes are on **both sides of the front door**, and they use **combination locks**\nrather than keys. The combinations follow a per-unit scheme recorded in the source; the\nvalues are protected and are not stored in this bundle. At least one has been changed by a\nresident since it was set.\n\n## Garbage\n\nIn the backyard, on the **west side** of the property.\n\n| Stream | Day |\n| --- | --- |\n| Trash | Monday |\n| Compost | Monday |\n| Fiber | Tuesday |\n| Recycling | Tuesday |\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov.\n\n## Common area service\n\n[Community Pro](/vendors/community-pro.md), monthly.", "properties/berkeley/2712-derby-street/inspections": "| Inspection | Inspector | Last recorded |\n| --- | --- | --- |\n| Fire safety | City of Berkeley Finance-Treasury Division, 510-981-7200 | Not recorded |\n| Building inspection | N/A | N/A |\n| Pest inspection | N/A | N/A |\n| Elevator | No elevator | No elevator |\n| Standpipe, five-year renewal | N/A | N/A |\n| Emergency light, annual | N/A | 01/2026 |\n| 3 extinguishers, annual | [Best Fire Equipment Company](/vendors/best-fire-equipment.md) | 01/2026 |\n| Sprinklers | N/A | N/A |\n\n## Notes\n\n* No date is recorded for the fire safety inspection.\n* The annual emergency light inspection carries a date but **no inspector**. Who performs\n  it is unresolved.\n\n## Related\n\n* [Safety systems](/properties/berkeley/2712-derby-street/safety-systems.md)", "properties/berkeley/2712-derby-street/maintenance": "## Repair history\n\n| Work | Year |\n| --- | --- |\n| Smart locks installed | 2023 |\n\n## Seasonal task - central heating\n\nAround **November**, switch on the central heating using the switch on the right-hand side\nimmediately inside the water heater room. One switch controls heating for the whole\nbuilding.\n\n## Recurring maintenance\n\n* **Door batteries** - replaced every time a tenant moves out. See\n  [Door battery replacement](/procedures/door-battery-replacement.md).\n* **Backup key inventory in the red lockbox** - recorded 10/2024.\n* **Common areas and landscape** - [Community Pro](/vendors/community-pro.md), monthly.\n\n## Pest control\n\n[Pest Control Contractor](/vendors/pest-control-contractor.md), 925-788-3614.\n\n## Warranty\n\nNo warranty information is recorded for installed items; the source marks this N/A.\n\n## Equipment locations\n\n| Equipment | Location |\n| --- | --- |\n| Boiler room | Storage room C |\n| Water heater room | Houses the central heating switch |\n| Electrical distribution | On the wall, right-hand side of the building |\n\n## Appliances\n\nPer-unit and common-area appliance label records are kept in the source; a missing label\nphoto means the long-term label application is unclear or missing.\n\n## Related\n\n* [Inspections](/properties/berkeley/2712-derby-street/inspections.md)", "properties/berkeley/2712-derby-street/property": "| Attribute | Value |\n| --- | --- |\n| Address | 2712 Derby Street, Berkeley, California |\n| Units | 9 |\n| Year built | 1912 |\n| Amenities | In-unit laundry, backyard |\n| Parking | None on site |\n\n## Structure\n\nTwo stairwells: one inside at the front of the property, one at the back. There is **no\nelevator** and **no roof access**.\n\n## Heating\n\nThe building uses a **central heating system**. During the winter season, usually around\nNo /pge.md) account.\n\nThe **water heater runs on the building's common utility gas**, not on a resident account.\n\n## Shutoff locations\n\n| System | Location |\n| --- | --- |\n| Circuit breaker | On the right side wall when facing the building |\n| Water shutoff | On the ground on the left side when facing the building, next to the railing, about a foot from the building |\n\n## Meters and plant\n\n| Equipment | Location |\n| --- | --- |\n| Water meter | On the ground in front of the building |\n| Gas meter | On the ground in front of the building |\n| PG&E smart meter | On the wall, right-hand side of the building |\n| Electrical distribution | On the wall, right-hand side of the building |\n| Boiler room | Storage room C |\n| Sewer | On the street |\n\n## Internet\n\nComcast, Xfinity, AT&T and [Sonic](/vendors/sonic.md). See\n[Utility and internet setup](/procedures/utility-and-internet-setup.md).", "properties/berkeley/3110-college-avenue/access-procedure": "## Entry points\n\nThe main entrance is opened by a code. There is also a **small lockbox by the main\nentrance holding a physical key**. After using it: return the key and **scramble the\ncode** - the source states this explicitly for this property.\n\nThree stairwells: one at the front inside the property and one on each side. Backyard and\ngarage access is to the left of the property from the street. **Backyard access is open.**\n\n## Backup keys - basement route\n\nGo down the stairs. The **second room on the right** is opened by a door code. Inside that\nroom is a **key box** opened by its own code.\n\n## Intercom\n\nThe building has an intercom entry system supplied by\n[Reed Brothers Security](/vendors/reed-brothers-security.md), 510-652-2477.\n\nWhen a unit changes hands the intercom **must be reprogrammed** so it calls the new\nresident's number rather than the previous tenant's. Residents can arrange this with the\nvendor directly, and the vendor will provide landlord verification on request. The source\nuses unit 5 as its worked example.\n\n## Access points and secret references\n\n| Access point | Reference |\n| --- | --- |\n| Main entrance | `secret_ref: physical-access/3110-college-avenue/main-entrance` |\n| Entrance lockbox holding a physical key | `secret_ref: physical-access/3110-college-avenue/entrance-lockbox` |\n| Basement backup key room door | `secret_ref: physical-access/3110-college-avenue/basement-key-room` |\n| Key box inside the basement key room | `secret_ref: physical-access/3110-college-avenue/basement-key-box` |\n| Basement boiler room | `secret_ref: physical-access/3110-college-avenue/boiler-room` |\n| Basement storage room | `secret_ref: physical-access/3110-college-avenue/basement-storage-room` |\n| Garage door opener padlocks | `secret_ref: physical-access/3110-college-avenue/garage-padlocks` |\n| Unit mailboxes, all 12 | `secret_ref: physical-access/3110-college-avenue/unit-mailboxes` |\n| Laundry room | `secret_ref: physical-access/3110-college-avenue/laundry-room` |\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/3110-college-avenue/amenities": "## Parking\n\n10 spaces at **$150**. The garage doors have **padlocks for the garage door openers**, and\nindividual spaces carry their own padlock combinations - two are recorded in the source.\nThose combinations are protected and are not stored in this bundle.\n\n## Laundry\n\n**In unit.** Every unit is recorded with a washer and dryer. There is no shared laundry\nroom.\n\n## Mail\n\nMailboxes are to the left of the front door. **Every unit's mailbox is opened by a code**,\none per unit. All twelve codes are protected and are not stored in this bundle.\n\n## Storage\n\nBasement storage room and basement boiler room, each behind its own coded door.\n\n## Garbage\n\nTo the right of the property when facing it from the street, in the backyard.\n\n| Stream | Day |\n| --- | --- |\n| Trash | Monday |\n| Recycling | Tuesday |\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov. The city\nrefuse account number is a protected identifier and is not stored in this bundle.\n\n## Common area service\n\n[Community Pro](/vendors/community-pro.md), monthly.", "properties/berkeley/3110-college-avenue/inspections": "| Inspection | Inspector | Last recorded |\n| --- | --- | --- |\n| Fire safety | City of Berkeley Finance-Treasury Division, 510-981-7200 | 3/7/2025 |\n| Building inspection | n/a | n/a |\n| Elevator | No elevator | N/A |\n| Standpipe, five-year renewal | N/A | N/A |\n| 1 fire alarm, annual | [Fire King Fire Protection](/vendors/fire-king-fire-protection.md) | 1/2026 |\n| 5 extinguishers, annual | [Best Fire Equipment Company](/vendors/best-fire-equipment.md) | 1/2026 |\n| Sprinklers | N/A | N/A |\n\n## Notes\n\nThe inspection program records an **annual fire alarm inspection** while\n[safety systems](/properties/berkeley/3110-college-avenue/safety-systems.md) states the\nbuilding has **no fire alarm system**. These cannot both be true. Unresolved; recorded in\nthe conversion review reports.\n\n## Related\n\n* [Safety systems](/properties/berkeley/3110-college-avenue/safety-systems.md)", "properties/berkeley/3110-college-avenue/maintenance": "## Repair history\n\n| Work | Year |\n| --- | --- |\n| Smart locks installed | 2023 |\n\nSeveral units are recorded as physical-key only, and four carry the note that the lock\nconfiguration **needs checking and testing at the office**. One unit's lock record is\nmarked missing. See [units](/properties/berkeley/3110-college-avenue/units/index.md).\n\n## Recurring maintenance\n\n* **Backup key inventory in the red lockbox** - recorded 10/2024. The source labels this\n  entry as the \"Derby red lockbox\" on this property's table, which appears to be a\n  copy-paste from [2712 Derby Street](/properties/berkeley/2712-derby-street/index.md).\n  Unresolved.\n* **Common areas and landscape** - [Community Pro](/vendors/community-pro.md), monthly.\n\n## Intercom\n\n[Reed Brothers Security](/vendors/reed-brothers-security.md), 510-652-2477. Reprogram on\nevery unit turnover.\n\n## Warranty\n\nNo warranty information is recorded for installed items; the source marks this n/a.\n\n## Equipment locations\n\n| Equipment | Location |\n| --- | --- |\n| Electrical distribution | Basement, right-hand side down the stairs |\n| Boiler room | Basement, behind a coded door |\n| Water heater room | Basement; houses the water and gas shutoffs |\n\n## Appliances\n\nPer-unit appliance records are kept in the source with no retrievable URLs.\n\n## Related\n\n* [Inspections](/properties/berkeley/3110-college-avenue/inspections.md)", "properties/berkeley/3110-college-avenue/property": "| Attribute | Value |\n| --- | --- |\n| Address | 3110 College Avenue, Berkeley, California |\n| Units | 12 |\n| Year built | 1965 |\n| Amenities | Secure parking |\n| Parking spaces | 10, at $150 |\n\n## Structure\n\nThree stairwells: one at the front inside the property, and one on each side. Access to\nthe backyard and garages is to the left of the property when facing it red in this bundle.\n\n## Related\n\n* [3110 College Avenue](/properties/berkeley/3110-college-avenue/index.md) - parent property\n* [All units at 3110 College Avenue](/properties/berkeley/3110-college-avenue/units/index.md)", "properties/berkeley/3110-college-avenue/utilities": "## What is included\n\n**Water, garbage and sewer** are in the utility passthrough. **Electricity is not** -\nresidents set up their own [PG&E](/vendors/pge.md) account.\n\n## Shutoff locations\n\nAll three shutoffs are in or near the basement, and this is one of the few properties in\nthe portfolio with an explicitly recorded **gas** shutoff.\n\n| System | Location |\n| --- | --- |\n| Circuit breaker | In the basement; down the stairs, on the wall of the first room on the right |\n| Water shutoff | In the basement water heater room, on the wall to the right on entering |\n| Gas shutoff | On the wall inside the water heater room |\n\n## Meters and plant\n\n| Equipment | Location |\n| --- | --- |\n| Water meter | In front of the building |\n| Gas meter | In front of the building |\n| PG&E smart meter | In the basement, right-hand side down the stairs |\n| Electrical distribution | In the basement, right-hand side down the stairs |\n| Boiler room | In the basement, behind a coded door |\n| Sewer | On the street |\n\n## Internet\n\nComcast, Xfinity, AT&T and [Sonic](/vendors/sonic.md). See\n[Utility and internet setup](/procedures/utility-and-internet-setup.md).", "properties/boston/19-21-buttonwood-street/access-procedure": "## Entry points\n\nThe general building is entered through a **keypad**. The keypad code is a protected value\nand is not stored in this bundle.\n\n## Unit access\n\n**Tenants use physical keys to open their unit doors.** There are no digital unit locks at\nthis property, so the phone-credential option in the\n[tenant lockout procedure](/procedures/tenant-lockout.md) does not apply here - fall back\nto the backup key or the office keys.\n\n## Backup keys\n\nIn the **basement**, in a lock box opened by its own code.\n\n## Door code changes\n\nThe source records a \"Change door code\" procedure for this property whose steps are\nentangled with protected values and are not reproduced here. Request the current procedure\nfrom the property manager.\n\n## Access points and secret references\n\n| Access point | Reference |\n| --- | --- |\n| General building keypad | `secret_ref: physical-access/19-21-buttonwood-street/main-entrance` |\n| Basement backup key lock box | `secret_ref: physical-access/19-21-buttonwood-street/basement-backup-lockbox` |\n| Unit door code | `secret_ref: physical-access/19-21-buttonwood-street/unit-door-code` |\n\n## Related\n\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/boston/19-21-buttonwood-street/amenities": "## Parking\n\n**4 open-air spaces at $250. No key required.**\n\n## Laundry\n\n**In-unit washers and dryers.** No shared laundry room, no payment method.\n\n## Mail\n\nMailboxes are in front of the entrance.\n\n## Storage\n\nIn the basement.\n\n## Roof\n\nRoof access for the top unit.\n\n## Garbage\n\nCity of Boston trash collection for 19-21 Buttonwood Street in Dorc it washers and dryers.**\n\n## Mail and storage\n\nBoth appear in the source as headings with no content.\n\n## Garbage\n\n[AmeriWaste](/vendors/ameriwaste.md). No location or schedule is recorded.\n\n## Common area service\n\n**None recorded** - the source marks the regular cleaning schedule N/A.", "properties/league-city/310-waco-avenue/inspections": "| Inspection | Inspector | Inspection date |\n| --- | --- | --- |\n| Fire safety | Not recorded | Not recorded |\n| Pest inspection | Not recorded | Not recorded |\n| Building inspection | Not recorded | Not recorded |\n| Elevator | Not recorded | Not recorded |\n\n**Every row is empty.** The source records the inspection categories as headings and\nnothing else.\n\nThis does not mean inspections are not happening. It means no inspection evidence exists\nin the source for this property, and none can be produced from it.\n\n## Related\n\n* [Safety systems](/properties/league-city/310-waco-avenue/safety-systems.md)\n* [Texas security deposit law](/jurisdictions/texas/security-deposits.md)", "properties/league-city/310-waco-avenue/maintenance": "## Repair history\n\n**None recorded.**\n\n## Vendor contacts\n\nThe source contains a vendor contact table for this property with the following categories\nand **no vendor entries at all**:\n\n* Cleaning service\n* Landscaping service\n* Pest control\n* Waste management\n* Mold prevention and cleaning\n\nThe only vendor recorded anywhere for this property is\n[AmeriWaste](/vendors/ameriwaste.md), named in the garbage section rather than in the\nvendor table.\n\n## Warranty, insurance and batteries\n\nAll three appear as headings with **no content**: warranty information for installed items,\ninsurance claim information, and door battery replacement.\n\n## Related\n\n* [Inspections](/properties/league-city/310-waco-avenue/inspections.md)", "properties/league-city/310-waco-avenue/property": "| Attribute | Value |\n| --- | --- |\n| Address | 310 Waco Avenue, League City, Texas |\n  --- |\n| Building access code | `secret_ref: physical-access/33-mine-street/main-entrance` |\n| Silver key lock box, basement | `secret_ref: physical-access/33-mine-street/basement-key-lockbox` |\n| Unit locks, units 3-9 | `secret_ref: physical-access/33-mine-street/unit-locks` |\n| NJ DCA portal (staff) | `secret_ref: account-credential/33-mine-street/nj-dca-portal` |\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/new-brunswick/33-mine-street/amenities": "## Parking\n\nStreet parking by New Brunswick city permit. The property is entitled to **4 free parking\npasses**.\n\n## Laundry\n\n**2 washers and 1 dryer**, in the **basement**, on the right-hand side as you enter.\n\nThe source does not record how the machines are paid for.\n\n## Mail\n\nMailboxes are in front of the entrance door.\n\n## Storage\n\n**None recorded** - marked N/A in the source.\n\n## Garbage\n\nStored **on the curb**; the collection area is in the **back yard**.\n\n| Stream | Schedule |\n| --- | --- |\n| Trash | Monday and Thursday mornings (Zone 1) |\n| Recycling | Every Monday of the two-week cycle |\n\nThe recycling entry is recorded in the source as \"Every Monday of the two weeks\", which is\nambiguous between weekly and fortnightly. It is reproduced as written.\n\n## Common area service\n\n**None recorded** - the source marks the regular cleaning schedule N/A.", "properties/new-brunswick/33-mine-street/inspections": "This property has the most **date-complete** inspection record in the portfolio: every row\ncarries a date.\n\n| Inspection | Authority | Recorded date |\n| --- | --- | --- |\n| Fire certificate | Recorded against a named inspector | 12/31/2026 |\n| Building inspection | New Jersey Department of Community Affairs (dca.nj.gov) | 8/10/2026 |\n| License to own / operate | Recorded against a named inspector | 7/16/2026 |\n\n## Inspector names\n\nThe source names individual inspectors, including a government email address. Individual\ninspector identities are personal information rather than durable property knowledge and\nare not reproduced here. The **New Jersey DCA** is recorded as the responsible agency for\nthe building inspection.\n\n## Notes\n\nThe source spells the third row \"Lincense to Own/Operate\"; corrected here to \"License to\nOwn/Operate\", which does not change the meaning.\n\n## Related\n\n* [Safety systems](/properties/new-brunswick/33-mine-street/safety-systems.md)\n* [New Jersey security deposit law](/jurisdictions/new-jersey/security-deposits.md)", "properties/new-brunswick/33-mine-street/maintenance": "## Repair history\n\n**None recorded.**\n\n## Recurring maintenance\n\nThe source lists a **door battery replacement** heading with no content. Whether this\nproperty has digital locks at all is unclear - the access records describe key locks for\nunits 3-9. See\n[Door battery replacement](/procedures/door-battery-replacement.md).\n\n## Warranty\n\nNo warranty information is recorded for installed items; the source marks this N/A.\n\n## Vendors\n\n**No vendors are recorded** for this property.\n\n## Related\n\n* [Inspections](/properties/new-brunswick/33-mine-street/inspections.md)", "properties/new-brunswick/33-mine-street/property": "| Attribute | Value |\n| --- | --- |\n| Address | 33 Mine Street, New Brunswick, New Jersey |\n| Units | 13 |\n| Year built | 1927 |\n| Parking | Street parking by city permit; the property is entitled to 4 free passes |\n\n## Units\n\nThe source states **13 units** but contains **no unit table** for this property, so no\nunit concepts exist in this bundle. Unit-level lock records exist for units 3 through 9\nonly; those are access records rather than unit inventory and are handled in the\n[access procedure](/properties/new-brunswick/33-mine-street/access-procedure.md).\n\nBuilding out the unit inventory for this property requires a property manager.\n\n## Parking\n\nResidents can apply for a parking pass on the New Brunswick parking website. **33 Mine\nStreet is entitled to 4 parking passes for free.**\n\n## Package delivery\n\nUnlike every other property in the portfolio, **delivery carriers do not have building\naccess here**. See\n[Package delivery access](/procedures/package-delivery-access.md).\n\n## Applicable jurisdiction\n\nNew Jersey. See [New Jersey](/jurisdictions/new-jersey/index.md).\n\n## Related\n\n* [Utilities](/properties/new-brunswick/33-mine-street/utilities.md)\n* [Access procedure](/properties/new-brunswick/33-mine-street/access-procedure.md)\n* [Inspections](/properties/new-brunswick/33-mine-street/inspections.md)", "properties/new-brunswick/33-mine-street/safety-systems": "The source records **no on-site fire equipment inventory** for this property - no\nextinguisher count, no alarm panel location, no hose or standpipe records. What it does\nrecord is the **regulatory** side.\n\n## Fire certificate\n\nA New Jersey fire certificate is recorded with a date of **12/31/2026**. See the\n[inspection program](/properties/new-brunswick/33-mine-street/inspections.md).\n\n## NJ DCA portal\n\nThe source records a New Jersey Department of Community Affairs portal account used by\nstaff for fire and building compliance. The login is protected - see the\n[access procedure](/properties/new-brunswick/33-mine-street/access-procedure.md).\n\n## Gap\n\nThe absence of an equipment inventory is a **documentation gap**, not evidence that the\nbuilding lacks fire equipment. A property manager should record the on-site inventory.\n\n## Related\n\n* [Inspection program](/properties/new-brunswick/33-mine-street/inspections.md)\n* [Emergency and safety response](/procedures/emergency-response.md)", "properties/new-brunswick/33-mine-street/utilities": "This concept is marked **restricted** because it references a staff-held municipal utility\naccount. No account number, PIN or credential value is stored here.\n\n## Water and sewer\n\nBilled by the **City of New Brunswick** through its online payment portal:\nhttps://wipp.edmundsassoc.com/Wipp/?wippid=1213\n\nThe account number and PIN for that portal are protected identifiers.\n\n```yaml\nsecret_ref: account-credential/33-mine-street/city-water-sewer-account\n```\n\n## What is included\n\nThe source does not state which utilities are in a passthrough at this property, or how\nelectricity and gas are handled. That is a gap, not an implied \"nothing included\".\n\n## Shutoff locations\n\n| System | Location |\n| --- | --- |\n| Circuit breaker | In the basement |\n| Water shutoff | In the basement |\n\n## Sewer\n\nOn the street.\n\n## Related\n\n* [Utility and internet setup](/procedures/utility-and-internet-setup.md)", "vendors/airwallet": "## Scope\n\nApp-based laundry payment. Residents download the AirWallet app and pay online.\nLaundry revenue at 1773 Oxford is connected to the operating bank account; the\naccount itself is transactional data and is **not** recorded in this bundle.\n\n## Resources\n\n* Instruction printout samples: https://wiser.airwallet.net/en/category/marketing-material-yyhky2/\n\n## Access\n\nThe AirWallet operator login is protected.\n\n```yaml\nsecret_ref: account-credential/1773-oxford/airwallet-operator-portal\n```\n\n## Properties served\n\n* [1773 Oxford](/properties/berkeley/1773-oxford/amenities.md)", "vendors/al-fresco-landscaping": "## Scope\n\nLandscaping.\n\n## Contact\n\n* Phone: 831-801-8379\n* Email: Mauricio@alfrescolandscaping.net\n\n## Properties served\n\n* [1773 Oxford](/properties/berkeley/1773-oxford/index.md)", "vendors/ameriwaste": "## Scope\n\nGarbage and waste management.\n\n## Contact\n\nNo phone, email, address or service schedule for this vendor is recorded in the\nsource knowledge base.\n\n## Properties served\n\n* [310 Waco Avenue](/properties/league-city/310-waco-avenue/index.md)", "vendors/august-jaye-fob-supply": "## Scope\n\nSells access fobs used by the 1773 Oxford access-control system.\n\n## Contact\n\n* Phone: (707) 478-0911\n* Email: justin@augustjaye.com\n\n## Properties served\n\n* [1773 Oxford](/properties/berkeley/1773-oxford/access-procedure.md)", "vendors/bay-alarm": "## Scope\n\n* Annual fire alarm inspection\n* Fire alarm monitoring (billed as a monitoring fee)\n\n## Properties served\n\n* [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/inspections.md) - fire alarm and monitoring, last update 01/2026\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/inspections.md) - fire alarm, last update 07/2026\n\n## Contact\n\nNo phone, email or address for this vendor is recorded in the source knowledge base.", "vendors/best-alarm-services": "## Scope\n\nFire alarm system (1 system, \"ALL info\" per the source). Next / last recorded date 12/2026.\n\n## Contact\n\n* Phone: 781-974-9451\n\n## Properties served\n\n* [19-21 Buttonwood Street](/properties/boston/19-21-buttonwood-street/inspections.md)", "vendors/best-fire-equipment": "## Scope\n\nAnnual fire extinguisher inspection and service.\n\n## Properties served\n\n* [1742 Spruce Street](/properties/berkeley/1742-spruce-street/inspections.md) - 6 extinguishers, last u 1742 Spruce Street](/properties/berkeley/1742-spruce-street/index.md)\n* [2340 Hilgard Avenue](/properties/berkeley/2340-hilgard-avenue/index.md)\n* [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/index.md)\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/index.md)\n* [2712 Derby Street](/properties/berkeley/2712-derby-street/index.md)\n* [3110 College Avenue](/properties/berkeley/3110-college-avenue/index.md)\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md)\n* [1773 Oxford](/properties/berkeley/1773-oxford/index.md)\n\n## Contact\n\nNo direct phone or email for this vendor is recorded in the source knowledge base.", "vendors/csc-serviceworks": "## Scope\n\nLaundry equipment service. This vendor collects its own coin revenue, so the\n[laundry coin collection SOP](/procedures/laundry-coin-collection.md) does **not** apply\nat properties served by this vendor.\n\nEquipment recorded in the source: GE Appliances, model GFQ14ESSN0WW.\nMachine IDs recorded: XPE-579 and HDT-403.\n\n## Contact\n\n* Phone: 510-253-3656\n* Alternate phone: 844-272-9675\n* Email: accountmanagement@cscsw.com\n* Web: client.onetapaway.com\n\n## Properties served\n\n* [2340 Hilgard Avenue](/properties/berkeley/2340-hilgard-avenue/amenities.md)", "vendors/ebmud": "## Scope\n\nWater service. Water is generally part of the utility passthrough at the Berkeley\nproperties, meaning tenants do not pay for it directly.\n\n## Landlord account\n\n1773 Oxford records a staff EBMUD account. The login is protected.\n\n```yaml\nsecret_ref: account-credential/1773-oxford/ebmud-account\n```\n\n## Properties served\n\nAll Berkeley properties. See [Berkeley properties](/properties/berkeley/index.md).", "vendors/fire-king-fire-protection": "## Scope\n\n* Standpipe five-year renewal inspections\n* Annual fire alarm inspections\n* Annual fire extinguisher inspection at 150 Panoramic Way\n\n## Contact\n\n* Phone: 415-567-9373 (recorded against the 150 Panoramic Way extinguisher inspection)\n\nNo email or address is recorded in the source.\n\n## Properties served\n\n* [1742 Spruce Street](/properties/berkeley/1742-spruce-street/inspections.md) - standpipes and fire alarm, last update 01/2026\n* [2340 Hilgard Avenue](/properties/berkeley/2340-hilgard-avenue/inspections.md) - standpipes, last update 01/2026\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/inspections.md) - standpipes, last update 01/2026\n* [3110 College Avenue](/properties/berkeley/3110-college-avenue/inspections.md) - fire alarm, last update 1/2026\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/inspections.md) - extinguisher, 3/2026\n\n## Notes\n\nThe source spells this vendor variously as \"Fire King Fire Protection\", \"Fire King Fire\"\nand \"Fire king\". They are treated here as one vendor; confirm with a property manager.", "vendors/hue-and-cry": "## Scope\n\n* Fire alarm monitoring, billed at a monthly fire inspection fee of $315\n* Annual fire alarm inspection (last recorded 04/2025)\n* CCTV, external lock and intercom support\n\n## Contact\n\n* Central Station: 1 (800) 762-3196\n* Business office (emergency): 800-800-2527, press 0\n* Fire alarm monitoring contact: 530-245-5024\n* Fire alarm monitoring email: b.cochran@hueandcry.com\n* CCTV / external lock / intercom contact: 650-670-0998\n* CCTV / external lock / intercom email: c.santos@hueandcry.com\n* Web: www.hueandcry.com\n\n## Properties served\n\n* [1773 Oxford](/properties/berkeley/1773-oxford/index.md)", "vendors/otis-elevator": "## Scope\n\nElevator inspection and service at [1773 Oxford](/properties/berkeley/1773-oxford/index.md).\nLast recorded inspection 05/2025. The source notes that **monthly self-inspection** is\nalso required.\n\n## Contact\n\n* Phone: 415-254-6109\n* Email: LUCINDA.BLINN@otis.com", "vendors/paramount-elevator": "## Scope\n\nElevator maintenance and **monthly** elevator inspection.\n\n## Contact\n\n* Phone: 510-864-1025\n* Alternate phone: (415) 362-0813\n* Email: office@paramountelevator.com\n\n## Properties served\n\n* [1742 Spruce Street](/properties/berkeley/1742-spruce-street/safety-systems.md)\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/safety-systems.md)\n\n## Notes\n\nThe source records a 2023-06 elevator motor starter contact replacement at 1742 Spruce\nStreet, billed at $1,425. Oakland District Office is named alongside this vendor in the\n1742 Spruce Street elevator inspection row; the division of responsibility between the\ntwo is not explained in the source.", "vendors/payrange": "## Scope\n\nMobile app payment for laundry machines, offered alongside coin payment.\n\n## Contact\n\n* Phone: (855) 856-6398\n\n## Properties served\n\n* [1742 Spruce Street](/properties/berkeley/1742-spruce-street/amenities.md)\n* [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/amenities.md)", "vendors/pest-control-contractor": "## Scope\n\nPest control.\n\n## Contact\n\n* Phone: 925-788-3614\n\n## Properties served\n\n* [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/maintenance.md)\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/maintenance.md)\n* [2712 Derby Street](/properties/berkeley/2712-derby-street/maintenance.md)\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/maintenance.md)\n\n## Open question\n\nThe source records only this phone number, repeated at four properties, with no\nbusiness name, contact person or email. The business name must be confirmed by a\nproperty manager before this profile is relied on.", "vendors/pge": "## Scope\n\nElectricity and, where present, gas service. At most Berkeley properties electricity is\n**not** part of the utility passthrough and tenants set up their own PG&E account\ndirectly.\n\n## Resident action\n\nSee [Utility and internet setup](/procedures/utility-and-internet-setup.md).\n\n## Landlord portal\n\n1773 Oxford records a PG&E project portal used by staff at\nhttps://yourprojects-pge.com/login. The login is protected.\n\n```yaml\nsecret_ref: account-credential/1773-oxford/pge-projects-portal\n```\n\n## Properties served\n\nAll Berkeley properties. See [Berkeley properties](/properties/berkeley/index.md).", "vendors/r2-mechanical": "## Scope\n\nMechanical work and standpipe inspection (3 standpipes, last recorded 04/2025).\n\n## Contact\n\n* Phone: 530-440-8886\n* Email: randy@r2mechanicalinc.com\n\n## Properties served\n\n* [1773 Oxford](/properties/berkeley/1773-oxford/safety-systems.md)", "vendors/reed-brothers-security": "## Scope\n\nIntercom setup and reprogramming, including redirecting a unit's intercom to a new\nresident's phone number. The vendor can provide landlord verification on request.\n\n## Contact\n\n* Phone: 510-652-2477\n\n## Properties served\n\n* [3110 College Avenue](/properties/berkeley/3110-college-avenue/access-procedure.md)", "vendors/rex-key-of-berkeley": "## Scope\n\nDuplication of high-security Schlage keys. The source states these keys **cannot** be\nduplicated at a general hardware retailer such as Home Depot or Ace Hardware.\n\n## Contact\n\nNo phone, email or address for this vendor is recorded in the source knowledge base;\nthe source names an individual key cutter at this business.\n\n## Cost note\n\nA full building re-key at 1742 Spruce Street is recorded as costing roughly $1,000.\n\n## Related\n\n* [Key handling SOP](/procedures/key-handling.md)\n* [1742 Spruce Street access procedure](/properties/berkeley/1742-spruce-street/access-procedure.md)", "vendors/sonic": "## Scope\n\nResidential internet service. The source describes Sonic as the best value option:\nfastest available speed and no data cap, and the strongest choice when a bill is split\nbetween three or more residents. Most units at several properties already have Sonic\ninstalled, though some do not.\n\n## Contact\n\n* Phone (recorded against 2340 Hilgard Avenue unit B-2 service): (800) 735-2929\n* Account portal: https://members.sonic.net/account/billing/\n\n## Building accounts\n\n1773 Oxford and 2340 Hilgard Avenue record staff-held Sonic accounts. The logins are\nprotected.\n\n```yaml\nsecret_ref: account-credential/1773-oxford/sonic-account-portal\nsecret_ref: account-credential/2340-hilgard-avenue/sonic-account-portal\n```\n\n## Related\n\n* [Utility and internet setup](/procedures/utility-and-internet-setup.md)", "vendors/staggs-construction": "## Scope\n\nElectrical work.\n\n## Contact\n\n* Phone: 707-775-0928\n* Email: richard@staggs-construction.com\n\n## Properties served\n\n* [1773 Oxford](/properties/berkeley/1773-oxford/index.md)", "vendors/star-elevator": "## Scope\n\nElevator inspection at [2340 Hilgard Avenue](/properties/berkeley/2340-hilgard-avenue/index.md).\n\n## Contact\n\n* Phone: 650-722-7301\n* Email: star@starelevator.com\n\n## Status\n\nThe source records an inspection on 11/08/2024 and notes that the contract was ended\nbecause the elevator was no longer in use. Elevator service at 2340 Hilgard Avenue was\ndiscontinued in 2023. Treat this vendor as **historical** unless a property manager\nconfirms otherwise.", "vendors/thorpe-design": "## Scope\n\nFire sprinkler inspection and service. Last recorded inspection 04/2025.\n\n## Contact\n\n* Phone: 925-481-9909\n* Email: vmartel@thorpedesign.com\n\n## Properties served\n\n* [1773 Oxford](/properties/berkeley/1773-oxford/safety-systems.md)", "vendors/tristar-fire-protection": "## Scope\n\nFire sprinkler tanks (1 tank). Recorded date 12/2026.\n\n## Contact\n\n* Phone: (617) 820-2702\n* Email: support@tristarfireprotection.com\n\n## Properties served\n\n* [19-21 Buttonwood Street](/properties/boston/19-21-buttonwood-street/inspections.md)", "vendors/wash-laundry": "## Scope\n\nSupplies, services and repairs the laundry machines and collects the money.\nEquipment models recorded in the source: VYX 250 and WHY 400.\n\n## Contact\n\n* Phone: 800-421-6897\n\n## Properties served\n\n* [2521 Regent Street](/properties
