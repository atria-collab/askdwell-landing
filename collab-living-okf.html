* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

/rex-key-of-berkeley", "target": "procedures/key-handling"}}, {"data": {"id": "vendors/rex-key-of-berkeley__properties/berkeley/1742-spruce-street/access-procedure", "source": "vendors/rex-key-of-berkeley", "target": "properties/berkeley/1742-spruce-street/access-procedure"}}, {"data": {"id": "vendors/sonic__procedures/utility-and-internet-setup", "source": "vendors/sonic", "target": "procedures/utility-and-internet-setup"}}, {"data": {"id": "vendors/thorpe-design__properties/berkeley/1773-oxford/safety-systems", "source": "vendors/thorpe-design", "target": "properties/berkeley/1773-oxford/safety-systems"}}, {"data": {"id": "vendors/tristar-fire-protection__properties/boston/19-21-buttonwood-street/inspections", "source": "vendors/tristar-fire-protection", "target": "properties/boston/19-21-buttonwood-street/inspections"}}, {"data": {"id": "vendors/wash-laundry__properties/berkeley/2521-regent-street/amenities", "source": "vendors/wash-laundry", "target": "properties/berkeley/2521-regent-street/amenities"}}, {"data": {"id": "vendors/x-extinguisher-service__properties/berkeley/1773-oxford/inspections", "source": "vendors/x-extinguisher-service", "target": "properties/berkeley/1773-oxford/inspections"}}], "bodies": {"jurisdictions/california/berkeley/rent-stabilization": "> **Not legal advice.** This concept is a draft summary written for Collab Living\n> operations staff from an internal knowledge base and from the public sources listed in\n> the frontmatter. It has not been reviewed by counsel and has not been human-verified.\n> Confirm every requirement against the cited primary source before acting on it.\n\n**Jurisdiction:** City of Berkeley, California.\n\n## When the first increase may be taken\n\nA landlord may not raise the rent for the remainder of the calendar year in which the\ntenancy started, nor for one additional calendar year. The internal source gives this\nworked example: a tenancy starting 1 March 2023 cannot see a rent increase for the rest of\n2023 or during 2024; the first Annual General Adjustment (AGA) increase may be taken in\n2025, with proper notice.\n\n## When the AGA may not be taken at all\n\nRegardless of when the tenancy started, a landlord may not take the AGA if any of the\nfollowing is true:\n\n* Rent Board registration fees have not been fully paid.\n* There is a Rent Board order denying AGAs, generally for a decrease in services or for\n  substandard conditions.\n* There are serious repair problems or outstanding housing code violations.\n* Interest on the security deposit for the unit has not been paid - see\n  [Berkeley security deposits](/jurisdictions/california/berkeley/security-deposits.md).\n\n## Fixed-term leases\n\nWhere a tenant holds a fixed-term lease, the landlord must wait until the lease term\nexpires to impose the AGA, unless the lease itself allows the increase.\n\n## Move-out notice\n\nThe internal source records a move-out notice period of **30 days in advance**. The source\ndoes not say whether this is the tenant's statutory notice, a lease term, or an internal\noperating expectation. Confirm before relying on it.\n\n## Related\n\n* [Berkeley tenant resources](/jurisdictions/california/berkeley/tenant-resources.md)\n* [Subleasing policy](/policies/subleasing.md)", "jurisdictions/california/berkeley/security-deposits": "> **Not legal advice.** This concept is a draft summary written for Collab Living\n> operations staff from an internal knowledge base and from the public sources listed in\n> the frontmatter. It has not been reviewed by counsel and has not been human-verified.\n> Confirm every requirement against the cited primary source before acting on it.\n\n**Jurisdiction:** City of Berkeley, California. These requirements sit **on top of**\n[California state security deposit law](/jurisdictions/california/security-deposits.md),\nwhich governs the deposit limit, the 21-day return window, itemization and photographs.\n\n## Annual interest on deposits\n\nSecurity deposits accrue simple interest. Interest accrued through **31 October** each\nyear is paid to the tenant annually **in December**, as a cash payment or as a rent\nrebate.\n\nThe rate is set by the Berkeley Rent Board and is commonly called the **Berkeley Bank\nRate**. Under BMC 13.76.070 it tracks the twelve-month average of the average rates paid\non six-month certificates of deposit by banks doing business in the City. The Rent Board\npublishes the rate each year; it is a moving figure and must be looked up, never\nremembered.\n\n## Late payment\n\nPer the Berkeley Rent Board, if the annual interest payment is not made by\n**31 January**, the tenant may recover interest at a rate of **10%** for the immediately\npreceding calendar year, and a tenant who has not received a refund of deposit interest\nfor prior years may deduct it from rent.\n\n> **Conflict with the internal source.** The internal knowledge base states the deadline\n> is **10 January**. The Berkeley Rent Board states **31 January**. The 10% figure in the\n> internal source matches. This bundle records the Rent Board figure and flags the\n> difference rather than silently resolving it. See `legal-review.md` in the conversion\n> review reports, which sit outside this bundle at\n> `knowledge-base/reviews/collab-living-okf/`.\n\n## AGA interaction\n\nA landlord who has failed to pay security deposit interest for a unit may not take the\nAnnual General Adjustment for that unit. See\n[Berkeley rent stabilization](/jurisdictions/california/berkeley/rent-stabilization.md).\n\n## Related\n\n* [Security deposit return SOP](/procedures/security-deposit-return.md)\n* [Berkeley tenant resources](/jurisdictions/california/berkeley/tenant-resources.md)", "jurisdictions/california/berkeley/tenant-resources": "Public, non-sensitive contact points recorded in the internal knowledge base for the\nBerkeley properties.\n\n## Berkeley Rent Stabilization Board\n\n* Web: https://rentboard.berkeleyca.gov/\n* Phone: (510) 981-7368\n* Email: rent@berkeleyca.gov\n\n## City of Berkeley - refuse and recycling customer service\n\nUsed for garbage and recycling questions at every Berkeley property.\n\n* Phone: (510) 981-7270\n* Email: customerservice@berkeleyca.gov\n\n## City of Berkeley - Finance / Treasury Division\n\nNamed in the source as the inspecting body for fire safety inspections at the Berkeley\nproperties.\n\n* Phone: 510-981-7200\n\n## City of Berkeley - resident parking permits\n\n* Web: https://berkeleyca.gov/city-services/parking/resident-parking-permits\n\n## UC Berkeley Student Legal Services\n\nTenant-facing legal assistance for student residents.\n\n* Web: https://sls.berkeley.edu/\n\n## City pipe emergency (recorded at 3110 College Avenue)\n\n* Phone: 510-981-6620\n\n## Related\n\n* [Berkeley properties](/properties/berkeley/index.md)\n* [Emergency response SOP](/procedures/emergency-response.md)", "jurisdictions/california/security-deposits": "> **Not legal advice.** This concept is a draft summary written for Collab Living\n> operations staff from an internal knowledge base and from the public sources listed in\n> the frontmatter. It has not been reviewed by counsel and has not been human-verified.\n> Confirm every requirement against the cited primary source before acting on it.\n\n**Jurisdiction:** State of California. Applies to every California property in the\nportfolio, including all Berkeley properties. Berkeley adds further requirements - see\n[Berkeley security deposits](/jurisdictions/california/berkeley/security-deposits.md).\n\n## Deposit limit\n\nEffective **1 July 2024** (AB 12, amending Civil Code section 1950.5), a landlord may not\ndemand or receive a security deposit greater than **one month's rent**, whether the unit\nis furnished or unfurnished.\n\n**Small-landlord exception.** A landlord who is a natural person, or an LLC whose members\nare all natural persons, and who owns no more than **two** residential rental properties\nthat together contain no more than **four** units offered for rent, may collect up to\n**two months' rent**.\n\n> Whether this exception applies to any Collab Living entity is a question for counsel and\n> ownership, not for this bundle. It is recorded here because the internal source\n> mentions it.\n\n## Return timeline\n\nThe deposit, or the remainder after lawful deductions, must be returned within\n**21 days** after the tenant vacates.\n\n## Permissible deductions\n\n* Unpaid rent\n* Repair of damage beyond normal wear and tear\n* Cleaning to return the unit to its condition at the start of the tenancy\n* Replacement of landlord-supplied personal property, where the lease provides for it\n\n## Itemization and documentation\n\nWhere deductions are taken, the landlord provides an itemized statement. Where deductions\nexceed **$125**, the landlord must also supply copies of receipts, invoices or equivalent\ndocumentation, unless the tenant has waived that right.\n\n## Photograph requirements (AB 2801)\n\n* From **1 April 2025** - the landlord must photograph the unit within a reasonable time\n  after regaining possession and **before** any repair or cleaning for which a deduction\n  will be claimed, and again within a reasonable time after that work is finished. The\n  photographs go to the tenant with the itemized statement and a written explanation of\n  cost.\n* For tenancies beginning on or after **1 July 2025** - the landlord must photograph the\n  unit immediately before, or at the start of, the tenancy.\n\n## Multiple adult tenants (AB 414)\n\nAB 414 was chaptered on **6 October 2025**. Under it, where a unit has multiple adult\ntenants and there is no written agreement to the contrary, the remaining deposit is\nreturned by **a single check payable to all adult tenants**, with the itemized statement\nfurnished to any one tenant the landlord chooses. Landlords and all adult tenants may\nagree in writing - at the start of the tenancy or later - on a different split, on\nelectronic disbursement to each tenant, and on how statements are furnished. Where a\nlandlord received rent or deposit electronically, the deposit must now be returned\nelectronically unless the parties agree otherwise in writing.\n\n> **Conflict with the internal source.** The internal knowledge base states that from\n> 1 January 2026 refunds in multi-tenant situations \"must be issued individually to each\n> renter separately,\" citing a commercial blog post. That is not what AB 414 provides.\n> See `legal-review.md` in the conversion review reports, which sit outside this bundle\n> at `knowledge-base/reviews/collab-living-okf/`.\n\n## Related\n\n* [Security deposit return SOP](/procedures/security-deposit-return.md)\n* [Berkeley security deposits](/jurisdictions/california/berkeley/security-deposits.md)", "jurisdictions/massachusetts/late-rent-charges": "> **Not legal advice.** This concept is a draft summary written for Collab Living\n> operations staff from an internal knowledge base and from the public sources listed in\n> the frontmatter. It has not been reviewed by counsel and has not been human-verified.\n> Confirm every requirement against the cited primary source before acting on it.\n\n**Jurisdiction:** Commonwealth of Massachusetts.\n\nA landlord may not charge interest or a penalty on late rent until **30 days** after the\ndue date.\n\nTwo things that are true at the same time and are easy to conflate:\n\n* The **late fee** clock does not start for 30 days.\n* The **eviction** process may begin immediately, even if rent is one day overdue.\n\nA landlord may not use a reverse penalty clause - a discount structured to push the tenant\nto pay early.\n\n> This summary reproduces the internal knowledge base. The internal source did not cite a\n> statute section for it, and no primary Massachusetts source was located during\n> conversion that states the 30-day rule in these terms. Treat it as **unverified** and\n> confirm with counsel before applying it. Recorded in legal-review.md.\n\n## Related\n\n* [Massachusetts security deposit law](/jurisdictions/massachusetts/security-deposits.md)", "jurisdictions/massachusetts/security-deposits": "> **Not legal advice.** This concept is a draft summary written for Collab Living\n> operations staff from an internal knowledge base and from the public sources listed in\n> the frontmatter. It has not been reviewed by counsel and has not been human-verified.\n> Confirm every requirement against the cited primary source before acting on it.\n\n**Jurisdiction:** Commonwealth of Massachusetts. Applies to\n[19-21 Buttonwood Street](/properties/boston/19-21-buttonwood-street/index.md).\n\nMassachusetts security deposit law is unusually unforgiving: several of the penalties\nbelow are **not discretionary**, and a tenant need not show bad faith or actual loss.\n\n## Deposit limit\n\nA landlord may collect a security deposit of no more than **one month's rent**.\n\nAt the start of a tenancy a landlord may also collect:\n\n* first month's rent\n* last month's rent\n* a fee covering the cost of a new lock and key\n\nA landlord may **not** charge application fees, pet fees or cleaning fees.\n\n## Escrow\n\nThe deposit must be held in a **separate, interest-bearing account in a bank located\nwithin the Commonwealth**, on terms placing it beyond the reach of the landlord's\ncreditors.\n\n## Receipt\n\nWithin **30 days** of receiving the deposit the landlord must give the tenant a receipt\nstating the bank's name and location, the amount deposited, the account number, and that\nthe tenant is entitled to all interest earned.\n\n> Account numbers belong on the tenant's receipt, not in this knowledge bundle. No\n> account number is recorded here.\n\n## Statement of condition\n\nWithin **10 days** of the start of the tenancy the landlord must provide a written\nstatement of the property's condition, listing existing damage, signed by both parties.\n\n## Interest\n\nWhere the deposit is held for one year or longer, interest is paid annually at **5% per\nyear, or the lesser amount actually earned by the bank**. It may be paid to the tenant or\ncredited against the next rent payment.\n\n## Return\n\nThe deposit plus accrued interest is returned within **30 days** after the tenancy ends.\n\nPermissible deductions:\n\n* unpaid rent\n* unpaid increases in real estate taxes, where the lease so provides\n* damage beyond normal wear and tear\n\nA landlord may **not** deduct for routine cleaning or minor repairs.\n\nWhere deductions are made, the landlord must provide an itemized list of damages **sworn\nunder the pains and penalties of perjury**, with supporting receipts or estimates.\n\n## Penalties\n\nFailure to comply - not escrowing the deposit separately, not providing required\ndocumentation, or not returning the deposit within 30 days - can entitle the tenant to\n**three times the deposit** plus **5% interest per year**, costs and fees.\n\n## Related\n\n* [Massachusetts late rent charges](/jurisdictions/massachusetts/late-rent-charges.md)\n* [Security deposit return SOP](/procedures/security-deposit-return.md)", "jurisdictions/new-jersey/security-deposits": "> **Not legal advice.** This concept is a draft summary written for Collab Living\n> operations staff from an internal knowledge base and from the public sources listed in\n> the frontmatter. It has not been reviewed by counsel and has not been human-verified.\n> Confirm every requirement against the cited primary source before acting on it.\n\n**Jurisdiction:** State of New Jersey. Applies to\n[33 Mine Street](/properties/new-brunswick/33-mine-street/index.md).\n\n## Deposit limit\n\nA security deposit may not exceed **1.5 times the monthly rent** (N.J.S.A. 46:8-21.2).\n\n## Annual additional deposit\n\nWhere a landlord collects an additional amount of security deposit, the amount collected\nannually as additional security may not exceed **10% of the current security deposit**\n(N.J.S.A. 46:8-21.2).\n\n## Interest-bearing account\n\nThe deposit must be held in an interest-bearing account at a New Jersey financial\ninstitution (N.J.S.A. 46:8-19).\n\n## Written notice\n\nWithin **30 days** of receiving the deposit the landlord must give the tenant written\nnotice stating:\n\n* the name and address of the bank or investment company holding the deposit\n* the type of account\n* the current rate of interest\n* the amount deposited\n\nAccrued interest is paid to the tenant annually, in cash or as a rent credit, with an\nannual notice carrying updated account information.\n\n## Return\n\nThe deposit plus accrued interest is returned within **30 days** after the lease\nterminates (N.J.S.A. 46:8-21.1). Where deductions are taken for damage beyond normal wear\nand tear or for unpaid rent, an itemized list must be provided within the same 30 days.\n\n## Related\n\n* [Security deposit return SOP](/procedures/security-deposit-return.md)\n* [Subleasing policy](/policies/subleasing.md)", "jurisdictions/texas/security-deposits": "> **Not legal advice.** This concept is a draft summary written for Collab Living\n> operations staff from an internal knowledge base and from the public sources listed in\n> the frontmatter. It has not been reviewed by counsel and has not been human-verified.\n> Confirm every requirement against the cited primary source before acting on it.\n\n**Jurisdiction:** State of Texas. Applies to\n[310 Waco Avenue](/properties/league-city/310-waco-avenue/index.md).\n\n## Deposit limit\n\nTexas law sets **no statutory maximum** for a residential security deposit. The internal\nsource notes that one to two months' rent is common practice; that is a market\nobservation, not a legal limit.\n\n## Refund timeline\n\nThe landlord must refund the deposit on or before the **30th day** after the tenant\nsurrenders the premises (Tex. Prop. Code s. 92.103).\n\n## Forwarding address\n\nThe landlord is not obliged to refund the deposit or furnish a written description of\ndamages until the tenant gives a **written forwarding address**. A tenant who fails to\ngive one does **not** forfeit the right to a refund - the obligation is deferred, not\nextinguished.\n\n## Deductions\n\nWhere deductions are taken, the landlord must give an itemized written list of the\ndamages and charges. Deductions may not be taken for normal wear and tear. Deductions\nrecorded in the internal source as permissible:\n\n* unpaid rent\n* damage beyond normal wear and tear\n* cleaning to restore the unit to its original condition\n* costs arising from the tenant's breach of the lease\n\n## Tenant remedies\n\nA landlord who acts in bad faith by retaining a deposit or failing to provide the itemized\nlist within the window may be liable for **$100**, **three times the portion wrongfully\nwithheld**, and the tenant's reasonable attorney's fees and court costs\n(Tex. Prop. Code s. 92.109). Claims under $20,000 may be brought in justice court.\n\n## Practice notes from the internal source\n\n* Document the unit's condition at move-in and move-out, preferably with time-stamped\n  photographs.\n* Keep all deposit communications in writing; certified mail gives proof of delivery.\n\n## Related\n\n* [Security deposit return SOP](/procedures/security-deposit-return.md)", "policies/resident-standards": "Applies to **all buildings** in the portfolio unless a property concept states otherwise.\n\n## Quiet hours\n\n**10:00 PM to 8:00 AM**, applicable to all buildings.\n\n## Replacement charges\n\nLost key, fob or access card: **$50 each**.\n\n## Off-hours emergency contact\n\n**(341) 202-5530**. See [Emergency response](/procedures/emergency-response.md) for what\nbelongs on this line and what belongs on 911 or 988.\n\n## Related\n\n* [Key handling SOP](/procedures/key-handling.md)\n* [Subleasing policy](/policies/subleasing.md)", "policies/subleasing": "Subleasing rules differ by city. This is the company's operating policy as recorded in the\ninternal knowledge base; it is not a statement of what local law permits.\n\n| City | Subleasing | Paperwork |\n| --- | --- | --- |\n| Berkeley | **Allowed** | A subtenancy agreement for a replacement tenant is used for signatures. |\n| Boston | **Not allowed** | - |\n| New Brunswick | **Not allowed** | - |\n\nLeague City is not addressed in the source's leasing and subleasing section. Do not assume\na rule for it.\n\n## Paperwork\n\nThe source names a \"Subtenancy Agreement - Replacement Tenant\" document for Berkeley but\nrecords no retrievable URL for it, so none is reproduced here. Request the current\ntemplate from the property manager.\n\n## Related\n\n* [Berkeley rent stabilization](/jurisdictions/california/berkeley/rent-stabilization.md)\n* [Resident standards](/policies/resident-standards.md)", "policies/transactional-data-boundary": "This bundle holds **durable property knowledge**: how a building works, where its\nequipment is, who services it, what the law requires, and what staff should do.\n\nIt deliberately does **not** hold live transactional data. The following are excluded and\nwere not copied from the source knowledge base:\n\n* Tenant records and personal information\n* Rent balances, ledgers and deposit amounts\n* Lease documents and lease state\n* Work orders, maintenance tickets and their status\n* Expense trackers, task pricing and per-task costs\n* Utility, bank and portal account numbers\n\nThose records live in Buildium or in an AskDwell database. This bundle does not restate\nthem and does not link to them, because no canonical resource identifier for them appears\nin the source. **No Buildium ID or URL has been invented** to fill that gap.\n\n## Where a source item was excluded\n\nExcluded items are recorded by category in the conversion review reports, which sit\noutside this bundle at `knowledge-base/reviews/collab-living-okf/`.\n\n## Credentials\n\nProtected access values are excluded on separate grounds - see\n[Key handling](/procedures/key-handling.md) and any property access procedure. They are\nreplaced with opaque `secret_ref` values that AskDwell's Access Broker resolves after an\nauthorization decision. OKF itself enforces nothing.", "policies/vendor-purchase-approval": "**Scope:** Boston portfolio.\n\nAny order placed with a Boston vendor requires **prior approval** from the Collab Living\nmanager responsible for Boston. The source names the individual approver; that name is an\ninternal staffing detail rather than durable property knowledge and is not reproduced\nhere. Confirm the current approver with the property manager before placing an order.\n\n## Boston vendors on the approved list\n\n* [Bright Busters LLC](/vendors/bright-busters.md) - cleaning and trash removal.\n* [Boston Handyman (Dan Frongillo)](/vendors/boston-handyman.md) - minor repairs.\n\n## Related\n\n* [19-21 Buttonwood Street](/properties/boston/19-21-buttonwood-street/index.md)", "procedures/door-battery-replacement": "## Trigger\n\nAcross the Berkeley portfolio the source records the same rule: door batteries are\nreplaced **every time a tenant moves out**. Several properties record this as a \"door\nbattery inspection\" rather than a replacement; the two phrasings appear interchangeably in\nthe source and the difference has not been resolved.\n\n## Properties with smart locks\n\n| Property | Smart locks installed |\n| --- | --- |\n| [1742 Spruce Street](/properties/berkeley/1742-spruce-street/maintenance.md) | 2023 |\n| [2340 Hilgard Avenue](/properties/berkeley/2340-hilgard-avenue/maintenance.md) | 2021 |\n| [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/maintenance.md) | 2021 |\n| [2521 Regent Street](/properties/berkeley/2521-regent-street/maintenance.md) | 2023 |\n| [2712 Derby Street](/properties/berkeley/2712-derby-street/maintenance.md) | 2023 |\n| [3110 College Avenue](/properties/berkeley/3110-college-avenue/maintenance.md) | 2023 |\n\nNot every unit at these properties has a smart lock; several units are recorded as\nphysical-key only.\n\n## 1773 Oxford\n\n[1773 Oxford](/properties/berkeley/1773-oxford/maintenance.md) has its own battery jump\nand change instructions. The tool location is recorded: a screwdriver and a 9V battery on\nthe bottom right side of the package locker. The source marks the battery inspection\nschedule for this property as **TBD**.\n\n## 19-21 Buttonwood Street\n\nTwo main-door batteries recorded as replaced by 8/1/2026.\nSee [maintenance](/properties/boston/19-21-buttonwood-street/maintenance.md).", "procedures/emergency-response": "Applies portfolio-wide.\n\n## Violent, threatening or unsafe behaviour\n\nIf anyone hears or witnesses behaviour that feels violent, threatening or unsafe:\n\n* Call **988** for mental-health crisis support, **or**\n* Call **911** immediately if there is any fear for personal safety.\n\n**No resident or employee should ever be put in the position of approaching someone who is\nacting violently.** This is not a judgement call to be made in the moment - do not\napproach; call.\n\n## Off-hours emergency contact\n\nCollab Living off-hours emergency line: **(341) 202-5530**.\n\n## Fire\n\nFire alarm panels, standpipes, extinguisher locations and emergency lighting are recorded\nper property under that property's safety systems concept. Standpipe systems in this\nportfolio are **dry** - the hoses carry no water until the fire department connects the\nbuilding's standpipe inlet to a water supply.\n\n## Utility and infrastructure\n\n* Water, gas, electrical and sewer shutoff locations are recorded on each property's\n  utilities concept.\n* City pipe emergency, Berkeley: **510-981-6620**.\n\n## Related\n\n* [Berkeley tenant and city resources](/jurisdictions/california/berkeley/tenant-resources.md)\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)", "procedures/key-handling": "Applies portfolio-wide.\n\n## Backup keys\n\nEvery building keeps backup keys in a designated lockbox or key box, and the office keeps\na further set for all buildings. Locations are recorded on each property's access\nprocedure. Several properties also record a periodic **red lockbox inspection** - a check\nthat the labelled backup keys are present and correct.\n\n## Scrambling\n\nAfter using any lockbox or key box, **scramble the combination**. Where a property\nprocedure requires it, take a photo as proof the key was returned.\n\n## Changing codes\n\nThe source knowledge base contains internal how-to entries for changing the code on\nFortlocks devices and on the red lockbox and master lock. Those procedures were recorded\nas headings without step-by-step content in the source, so they are **not** reproduced\nhere. Ask the property manager for the current procedure.\n\n## Knox box\n\nThe Knox box holds keys and door codes for the fire department. **Only firefighters can\nopen it.** To update its contents, contact the fire department and book an appointment for\nthem to attend the property and open the box so the new keys or codes can be placed\ninside.\n\n## High-security keys\n\nAt [1742 Spruce Street](/properties/berkeley/1742-spruce-street/access-procedure.md) the\nmain building front door, garage door and back stairwell door share one high-security\nSchlage key. It can only be duplicated by\n[Rex Key of Berkeley](/vendors/rex-key-of-berkeley.md) - not by a general hardware\nretailer.\n\nWhere a tenant loses one of these keys, charge for the key and make a deliberate decision\nabout whether to re-key the whole building. A full re-key at 1742 Spruce Street is\nrecorded as costing roughly **$1,000**.\n\n## Fobs\n\n[1773 Oxford](/properties/berkeley/1773-oxford/access-procedure.md) uses fobs and phone\ncredentials rather than shared door codes for resident access. Fobs are supplied by\n[August Jaye](/vendors/august-jaye-fob-supply.md).\n\n## Charges\n\nLost key, fob or access card: **$50 each**. See\n[Resident standards](/policies/resident-standards.md).\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "procedures/laundry-coin-collection": "Applies only where the laundry vendor does **not** collect its own revenue.\n\n## Cadence\n\nCollect once every **six months**.\n\n## Where staff collect\n\n* [1742 Spruce Street](/properties/berkeley/1742-spruce-street/amenities.md) - 2 washers,\n  2 dryers; coin or [PayRange](/vendors/payrange.md). Source records a collection on\n  6/20/2026.\n* [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/amenities.md) -\n  coin or PayRange. Source records a collection on 6/11/2026.\n\n## Where the vendor collects instead\n\n* [2340 Hilgard Avenue](/properties/berkeley/2340-hilgard-avenue/amenities.md) -\n  [CSC ServiceWorks](/vendors/csc-serviceworks.md) collects its own coin revenue.\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/amenities.md) -\n  [WASH](/vendors/wash-laundry.md) collects the money and repairs the machines.\n\n## Where the question does not arise\n\n* [2712 Derby Street](/properties/berkeley/2712-derby-street/amenities.md),\n  [3110 College Avenue](/properties/berkeley/3110-college-avenue/amenities.md) - in-unit\n  laundry.\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/amenities.md) - shared\n  laundry, free to residents.\n* [1773 Oxford](/properties/berkeley/1773-oxford/amenities.md) - app payment via\n  [AirWallet](/vendors/airwallet.md).\n\n## Note\n\nThe source names individual staff members against past collections. Those names are\noperational assignment records rather than durable knowledge and are not reproduced here.", "procedures/move-out-documentation": "## Pre-tenancy documentation\n\n**California.** For tenancies beginning on or after **1 July 2025**, photograph the unit\nimmediately before, or at the start of, the tenancy to document its condition.\n\n**Massachusetts.** Within **10 days** of the start of the tenancy, provide a written\nstatement of condition listing existing damage, signed by both parties. This is a\ndifferent instrument from a photograph set and does not substitute for one.\n\n## Move-out walk-through\n\n**Berkeley / California.** Tenants may request a walk-through inspection during the last\ntwo weeks of tenancy, giving them a chance to address issues that would otherwise become\ndeductions.\n\n## Post-possession documentation\n\n**California, from 1 April 2025.** Where deductions will be claimed, photograph the unit\nwithin a reasonable time after regaining possession and **before** any repair or cleaning,\nand again within a reasonable time after that work finishes. Provide the photographs to\nthe tenant with the itemized statement and a written explanation of cost.\n\n**Texas.** The internal source records time-stamped move-in and move-out photographs as\nrecommended practice.\n\n## Related\n\n* [Security deposit return SOP](/procedures/security-deposit-return.md)\n* [California security deposit law](/jurisdictions/california/security-deposits.md)\n* [Massachusetts security deposit law](/jurisdictions/massachusetts/security-deposits.md)", "procedures/package-delivery-access": "## Carrier building access\n\nAmazon, USPS, UPS and FedEx delivery drivers hold access codes that let them enter the\nbuildings and deliver packages directly to residents' doors.\n\n**Exception:** this does **not** apply at\n[33 Mine Street](/properties/new-brunswick/33-mine-street/access-procedure.md).\n\n## Carrier access codes\n\nCarrier access codes are protected values and are not stored in this bundle. They are\nissued and rotated through the same channel as other building access codes; resolve them\nthrough AskDwell's Access Broker.\n\n## Package receptacles\n\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/access-procedure.md) - a\n  grey package drop box in front of the entrance, opened by a protected code.\n* [1773 Oxford](/properties/berkeley/1773-oxford/access-procedure.md) - USPS packages are\n  left in parcel boxes within the mailbox unit. Delivery locker hardware documentation:\n  https://www.digilock.com/products/smart-locks/curve/\n\n## Related\n\n* [Key handling SOP](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "procedures/security-deposit-return": "Applies portfolio-wide, but the **deadlines and penalties differ by jurisdiction**. Always\nopen the jurisdiction concept for the property before acting.\n\n| Jurisdiction | Return deadline | Concept |\n| --- | --- | --- |\n| California (all Berkeley properties) | 21 days | [California security deposit law](/jurisdictions/california/security-deposits.md) |\n| Berkeley - annual deposit interest, in addition | December each year | [Berkeley security deposit interest](/jurisdictions/california/berkeley/security-deposits.md) |\n| Massachusetts (Boston) | 30 days | [Massachusetts security deposit law](/jurisdictions/massachusetts/security-deposits.md) |\n| New Jersey (New Brunswick) | 30 days | [New Jersey security deposit law](/jurisdictions/new-jersey/security-deposits.md) |\n| Texas (League City) | 30 days | [Texas security deposit law](/jurisdictions/texas/security-deposits.md) |\n\n## Sequence\n\n1. **Offer the move-out inspection.** In Berkeley, tenants have the right to request a\n   walk-through inspection during the last two weeks of tenancy, so they can fix issues\n   that would otherwise become deductions. Offer it; do not wait to be asked.\n2. **Photograph the unit.** In California, photographs are required both at the start of\n   tenancy (tenancies beginning on or after 1 July 2025) and after regaining possession\n   before any repair or cleaning (from 1 April 2025), plus again after the work. In Texas\n   the internal source recommends time-stamped photographs at move-in and move-out as\n   practice rather than statute.\n3. **Compute deductions.** Only the categories the jurisdiction allows. Normal wear and\n   tear is never deductible anywhere in this portfolio.\n4. **Assemble the itemized statement.** California requires supporting documentation where\n   deductions exceed $125. Massachusetts requires the itemized list to be sworn under the\n   pains and penalties of perjury.\n5. **Return the balance within the jurisdiction's window**, with interest where the\n   jurisdiction requires it.\n\n## What this SOP does not hold\n\nTenant balances, ledgers, deposit amounts and individual move-out records are\ntransactional data. They belong in Buildium or an AskDwell database, not in this knowledge\nbundle.\n\n## Related\n\n* [Move-out and documentation requirements](/procedures/move-out-documentation.md)", "procedures/tenant-lockout": "Applies portfolio-wide. Individual properties may add steps - always read the property's\nown access procedure alongside this SOP.\n\n## Options, in the order the source lists them\n\n1. **Backup key from the building's backup key lockbox.** Every building keeps a backup\n   key for the unit's smart lock or physical lock in the building backup key lockbox. The\n   lockbox location is recorded per property; the combination is not stored in this\n   bundle.\n2. **Remote phone credential.** Where the unit has a smart lock, staff can use the Safely\n   App remotely to issue a phone credential letting the tenant unlock their own door.\n3. **Office backup keys.** The office keeps backup keys for all buildings and can use\n   them to access the unit if needed.\n\n## Charges\n\nLost key, fob or access card: **$50 each**. See\n[Resident standards](/policies/resident-standards.md).\n\n## Credential handling\n\nEvery backup lockbox and key box in this portfolio is protected by a combination that is\n**not** recorded in this bundle. Retrieve it through AskDwell's Access Broker using the\n`secret_ref` recorded on the property's access procedure concept.\n\nAfter any use of a lockbox, **scramble the combination** and, where the property procedure\ncalls for it, provide a photo confirming the key was returned.\n\n## Property access procedures\n\n* [1742 Spruce Street](/properties/berkeley/1742-spruce-street/access-procedure.md)\n* [2340 Hilgard Avenue](/properties/berkeley/2340-hilgard-avenue/access-procedure.md)\n* [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/access-procedure.md)\n* [2521 Regent Street](/properties/berkeley/2521-regent-street/access-procedure.md)\n* [2712 Derby Street](/properties/berkeley/2712-derby-street/access-procedure.md)\n* [3110 College Avenue](/properties/berkeley/3110-college-avenue/access-procedure.md)\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/access-procedure.md)\n* [1773 Oxford](/properties/berkeley/1773-oxford/access-procedure.md)\n* [19-21 Buttonwood Street](/properties/boston/19-21-buttonwood-street/access-procedure.md)\n* [33 Mine Street](/properties/new-brunswick/33-mine-street/access-procedure.md)\n* [310 Waco Avenue](/properties/league-city/310-waco-avenue/access-procedure.md)\n\n## Related\n\n* [Key handling SOP](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "procedures/utility-and-internet-setup": "## What the resident sets up\n\nAt most Berkeley properties, water, garbage, sewer and trash are covered by the **utility\npassthrough**, meaning the resident does not pay for them directly. **Electricity - and\ngas where the building has it - is normally not included**, and the resident sets up their\nown account with [PG&E](/vendors/pge.md).\n\nThe exceptions matter, and they are recorded per property:\n\n* [2421-2427 Durant Avenue](/properties/berkeley/2421-2427-durant-avenue/utilities.md) -\n  only 2425 and 2427 are in the passthrough, because those buildings have no individual\n  meter.\n* [1773 Oxford](/properties/berkeley/1773-oxford/utilities.md) - water, internet, gas and\n  heating are included; there is a common-area utility charge; water is separately metered\n  and billed to each unit, covered by the lease.\n* [19-21 Buttonwood Street](/properties/boston/19-21-buttonwood-street/utilities.md) -\n  residents set up water, electricity, gas and internet themselves.\n* [310 Waco Avenue](/properties/league-city/310-waco-avenue/utilities.md) - no passthrough;\n  everything is included.\n\n## Internet options in Berkeley\n\nThree providers are available at the Berkeley properties. The internal source's assessment:\n\n* **[Sonic](/vendors/sonic.md)** - best value. Fastest available speed, no data cap. The\n  strongest choice where the bill is split between three or more residents. Already\n  installed in most units at several properties, though not all.\n* **Comcast Xfinity** - cheapest, and already installed in every unit at some properties.\n  Varying speed tiers with a monthly data cap; exceeding it incurs a fee unless the\n  resident pays for unlimited data. Best for residents who do not need high speed or heavy\n  data.\n* **AT&T** - the source records this as **not recommended**, without stating why.\n\nAt [1773 Oxford](/properties/berkeley/1773-oxford/utilities.md), residents may buy their\nown service from AT&T or Sonic and must contact the provider directly.\n\n## Related\n\n* [Pacific Gas and Electric (PG&E)](/vendors/pge.md)\n* [East Bay Municipal Utility District (EBMUD)](/vendors/ebmud.md)", "properties/berkeley/150-panoramic-way/access-procedure": "## Entry points\n\nGo to the **deck area** and take the east-side stairwell key from the key box there. The\nbox is opened by a code, and the key it holds opens the right-hand side door.\n\nFacing the building, the **left** stairwell reaches units 2 and 5 and the **right**\nstairwell reaches units 3 and 4. The two stairwells are connected in the middle, so either\ncan be used to cross between them once inside.\n\n**Roof access: none recorded.**\n\n## Backup keys\n\nDirectly opposite the **unit 4 door** is a door leading to a **storage area**. Inside is a\n**red lock box containing all the spare keys, all labelled**, opened by its own\ncombination.\n\nThis is the most straightforward backup key arrangement in the Berkeley portfolio - one\nbox, everything labelled.\n\n## Access points and secret references\n\n| Access point | Reference |\n| --- | --- |\n| Deck key box holding the east stairwell key | `secret_ref: physical-access/150-panoramic-way/deck-key-box` |\n| Red lock box in the storage area opposite unit 4 | `secret_ref: physical-access/150-panoramic-way/spare-key-lockbox` |\n| Laundry room | `secret_ref: physical-access/150-panoramic-way/laundry-room` |\n\n## Surveillance\n\nNone recorded - marked N/A in the source.\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/150-panoramic-way/amenities": "## Parking\n\n**Street parking only.** No price and no map are recorded.\n\n## Laundry\n\n* 1 washer, 1 dryer\n* **Free** to residents - no coin, no app, no charge\n\nBecause it is free, the\n[laundry coin collection SOP](/procedures/laundry-coin-collection.md) does not apply here.\n\n## Mail\n\n**Not recorded.** The source marks both mailbox location and mailbox keys N/A. Whether the\nproperty has no mailboxes or the information is simply missing is unresolved.\n\n## Storage\n\n**Not recorded** - marked N/A in the source. Note that the\n[access procedure](/properties/berkeley/150-panoramic-way/access-procedure.md) does\ndescribe a storage area opposite unit 4 holding the spare keys, so \"N/A\" here appears to\nmean \"no resident storage\" rather than \"no storage rooms\".\n\n## Garbage\n\n**All carts** are on the top floor, on the left side of unit 1, collected **Monday**.\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov.\n\n## Common area service\n\n[Community Pro](/vendors/community-pro.md), monthly.", "properties/berkeley/150-panoramic-way/inspections": "| Inspection | Inspector | Last recorded |\n| --- | --- | --- |\n| Fire safety | n/a | n/a |\n| Building inspection | n/a | n/a |\n| Pest inspection | n/a | n/a |\n| Elevator | n/a | n/a |\n| Standpipe, five-year renewal | N/A | N/A |\n| Fire alarm, annual | N/A | N/A |\n| Extinguisher, annual | [Fire King Fire Protection](/vendors/fire-king-fire-protection.md), 415-567-9373 | 3/2026 |\n| Sprinklers | N/A | N/A |\n\n## Notes\n\nThis property has the **thinnest inspection record in the portfolio**. Only the annual\nextinguisher service carries an inspector and a date. In particular, no fire safety\ninspection is recorded here, while every other Berkeley property records one by the City\nof Berkeley Finance-Treasury Division. Whether that reflects a genuine gap or a\nrecord-keeping gap needs a property manager's answer.\n\n## Related\n\n* [Safety systems](/properties/berkeley/150-panoramic-way/safety-systems.md)", "properties/berkeley/150-panoramic-way/maintenance": "## Repair history\n\n**None recorded.** The source marks maintenance and repair history N/A for this property.\nThat is an absence of records, not evidence that no work has been done.\n\n## Recurring maintenance\n\n* **Door batteries** - replaced every time a tenant moves out. See\n  [Door battery replacement](/procedures/door-battery-replacement.md). Note that the unit\n  table for this property records **no digital locks**, so what this applies to is unclear.\n* **Red lockbox inspection** - recorded 10/2024.\n* **Backup key inventory in the red lockbox** - recorded 10/2024.\n* **Common areas and landscape** - [Community Pro](/vendors/community-pro.md), monthly.\n\n## Pest control\n\n[Pest Control Contractor](/vendors/pest-control-contractor.md), 925-788-3614.\n\n## Warranty\n\nNo warranty information is recorded for installed items; the source marks this N/A.\n\n## Equipment locations\n\n| Equipment | Location |\n| --- | --- |\n| Electrical distribution | On the wall on the left side of the building, near the motorcycle parking area |\n| Boilers | Behind the door across from the laundry room; unit 1's is in its own bathroom |\n| Spare key storage area | Directly opposite the unit 4 door |\n\n## Related\n\n* [Inspections](/properties/berkeley/150-panoramic-way/inspections.md)", "properties/berkeley/150-panoramic-way/property": "| Attribute | Value |\n| --- | --- |\n| Address | 150 Panoramic Way, Berkeley, California |\n| Units | 5 |\n| Year built | 1965 |\n| Amenities | On-site laundry, balconies/patios on most units |\n| Parking | Street parking only |\n\n## Structure\n\nTwo stairwells, **connected in the middle**. Facing the building:\n\n* The **left** stairwell reaches units 2 and 5.\n* The **right** stairwell reaches units 3 and 4.\n\nThere is a deck area, and a motorcycle parking area on the first floor.\n\n## Units\n\nFive units numbered 1-5, all two-bedroom, one-bathroom.\nSee [units](/properties/berkeley/150-panoramic-way/units/index.md).\n\n## Applicable jurisdiction\n\nBerkeley, California. See [Berkeley](/jurisdictions/california/berkeley/index.md).\n\n## Related\n\n* [Utilities](/properties/berkeley/150-panoramic-way/utilities.md)\n* [Access procedure](/properties/berkeley/150-panoramic-way/access-procedure.md)\n* [Safety systems](/properties/berkeley/150-panoramic-way/safety-systems.md)", "properties/berkeley/150-panoramic-way/safety-systems": "## Fire alarm and hoses\n\nThe source records **N/A** for fire hoses. The fire alarm entry is not stated in\nreproducible form, and the\n[inspection program](/properties/berkeley/150-panoramic-way/inspections.md) marks the\nannual fire alarm inspection N/A with no inspector and no date. Treat the building as\nhaving no fire alarm system, but confirm with a property manager before relying on that.\n\n## Fire extinguishers\n\nThree:\n\n1. On the right side of the deck, near unit 1\n2. Near the entrance/exit of unit 4\n3. In front of the laundry room\n\n## Standpipes and sprinklers\n\nBoth marked N/A in the inspection program.\n\n## Elevator\n\nNone.\n\n## Related\n\n* [Fire King Fire Protection](/vendors/fire-king-fire-protection.md) - annual extinguisher service, 3/2026\n* [Emergency and safety response](/procedures/emergency-response.md)", "properties/berkeley/150-panoramic-way/units/1": "Unit **1** at [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md).\n\n| Attribute | Value |\n| --- | --- |\n| Property | [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) |\n| Unit | 1 |\n| Bedrooms | 2 |\n| Bathrooms | 1 |\n\n## Unit features\n\nThe source's unit table for this property records unit number, bedroom and bathroom counts, a backup-key count and media entries. The thirteen feature columns are empty for every row, so no per-unit feature flags are recorded.\n\n## Notes\n\n* A fire extinguisher is located on the right side of the deck, near this unit. The boiler for this unit is inside the unit's bathroom, unlike the other units.\n* Garbage carts are on the top floor, on the left side of this unit.\n\n## Media\n\nThe source records photo, VR-tour and floor-plan entries for units at this property as the bare word \"link\" or as a filename with no retrievable URL. No usable URL exists, so none is recorded here.\n\n## Access\n\nUnit access, backup keys and any protected codes are covered by [the property access procedure](/properties/berkeley/150-panoramic-way/access-procedure.md). No credential value is stored in this bundle.\n\n## Related\n\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) - parent property\n* [All units at 150 Panoramic Way](/properties/berkeley/150-panoramic-way/units/index.md)", "properties/berkeley/150-panoramic-way/units/2": "Unit **2** at [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md).\n\n| Attribute | Value |\n| --- | --- |\n| Property | [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) |\n| Unit | 2 |\n| Bedrooms | 2 |\n| Bathrooms | 1 |\n\n## Unit features\n\nThe source's unit table for this property records unit number, bedroom and bathroom counts, a backup-key count and media entries. The thirteen feature columns are empty for every row, so no per-unit feature flags are recorded.\n\n## Notes\n\n* Reached by the stairwell on the left when facing the building.\n\n## Media\n\nThe source records photo, VR-tour and floor-plan entries for units at this property as the bare word \"link\" or as a filename with no retrievable URL. No usable URL exists, so none is recorded here.\n\n## Access\n\nUnit access, backup keys and any protected codes are covered by [the property access procedure](/properties/berkeley/150-panoramic-way/access-procedure.md). No credential value is stored in this bundle.\n\n## Related\n\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) - parent property\n* [All units at 150 Panoramic Way](/properties/berkeley/150-panoramic-way/units/index.md)", "properties/berkeley/150-panoramic-way/units/3": "Unit **3** at [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md).\n\n| Attribute | Value |\n| --- | --- |\n| Property | [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) |\n| Unit | 3 |\n| Bedrooms | 2 |\n| Bathrooms | 1 |\n\n## Unit features\n\nThe source's unit table for this property records unit number, bedroom and bathroom counts, a backup-key count and media entries. The thirteen feature columns are empty for every row, so no per-unit feature flags are recorded.\n\n## Notes\n\n* Reached by the stairwell on the right when facing the building.\n* The source marks this unit's backup-key record as missing.\n\n## Media\n\nThe source records photo, VR-tour and floor-plan entries for units at this property as the bare word \"link\" or as a filename with no retrievable URL. No usable URL exists, so none is recorded here.\n\n## Access\n\nUnit access, backup keys and any protected codes are covered by [the property access procedure](/properties/berkeley/150-panoramic-way/access-procedure.md). No credential value is stored in this bundle.\n\n## Related\n\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) - parent property\n* [All units at 150 Panoramic Way](/properties/berkeley/150-panoramic-way/units/index.md)", "properties/berkeley/150-panoramic-way/units/4": "Unit **4** at [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md).\n\n| Attribute | Value |\n| --- | --- |\n| Property | [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) |\n| Unit | 4 |\n| Bedrooms | 2 |\n| Bathrooms | 1 |\n\n## Unit features\n\nThe source's unit table for this property records unit number, bedroom and bathroom counts, a backup-key count and media entries. The thirteen feature columns are empty for every row, so no per-unit feature flags are recorded.\n\n## Notes\n\n* Reached by the stairwell on the right when facing the building.\n* A fire extinguisher is located near this unit's entrance/exit. The storage area holding the labelled spare keys is directly opposite this unit's door.\n\n## Media\n\nThe source records photo, VR-tour and floor-plan entries for units at this property as the bare word \"link\" or as a filename with no retrievable URL. No usable URL exists, so none is recorded here.\n\n## Access\n\nUnit access, backup keys and any protected codes are covered by [the property access procedure](/properties/berkeley/150-panoramic-way/access-procedure.md). No credential value is stored in this bundle.\n\n## Related\n\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) - parent property\n* [All units at 150 Panoramic Way](/properties/berkeley/150-panoramic-way/units/index.md)", "properties/berkeley/150-panoramic-way/units/5": "Unit **5** at [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md).\n\n| Attribute | Value |\n| --- | --- |\n| Property | [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) |\n| Unit | 5 |\n| Bedrooms | 2 |\n| Bathrooms | 1 |\n\n## Unit features\n\nThe source's unit table for this property records unit number, bedroom and bathroom counts, a backup-key count and media entries. The thirteen feature columns are empty for every row, so no per-unit feature flags are recorded.\n\n## Notes\n\n* Reached by the stairwell on the left when facing the building.\n\n## Media\n\nThe source records photo, VR-tour and floor-plan entries for units at this property as the bare word \"link\" or as a filename with no retrievable URL. No usable URL exists, so none is recorded here.\n\n## Access\n\nUnit access, backup keys and any protected codes are covered by [the property access procedure](/properties/berkeley/150-panoramic-way/access-procedure.md). No credential value is stored in this bundle.\n\n## Related\n\n* [150 Panoramic Way](/properties/berkeley/150-panoramic-way/index.md) - parent property\n* [All units at 150 Panoramic Way](/properties/berkeley/150-panoramic-way/units/index.md)", "properties/berkeley/150-panoramic-way/utilities": "## What is included\n\n**Water, garbage and sewer** are in the utility passthrough. **Electricity is not** -\nresidents set up their own [PG&E](/vendors/pge.md) account.\n\n## Electricity metering - two meters, not five\n\nThe building has **two** electricity meters, and they do not map one-to-one onto units:\n\n* **Meter 1** serves the two apartments toward the **east**.\n* **Meter 2** serves the three apartments toward the **west**, plus the laundry room.\n\nAnyone reasoning about a resident's electricity bill at this property needs this split.\nThe source does not say which unit numbers fall on which side.\n\n## Shutoff locations\n\n| System | Location |\n| --- | --- |\n| Circuit breaker | On the wall next to the deck on the left side when facing the building, near the motorcycle parking area on the first floor |\n| Water shutoff | At the stair entrance on the right side when facing the building |\n| Gas shutoff | At the stair entrance on the right side when facing the building |\n\n## Meters and plant\n\n| Equipment | Location |\n| --- | --- |\n| Water meter | In front of the building |\n| Gas meter | In front of the building, near the staircase |\n| PG&E smart meter | On the wall on the left side of the building, near the motorcycle parking area |\n| Electrical distribution | On the wall on the left side of the building, near the motorcycle parking area |\n| Sewer | On the street |\n\n## Boilers\n\n**One boiler per unit**, behind the door across from the laundry room - except unit 1,\nwhose boiler is inside that unit's bathroom.\n\n## Internet\n\nComcast, Xfinity, AT&T and [Sonic](/vendors/sonic.md). See\n[Utility and internet setup](/procedures/utility-and-internet-setup.md).", "properties/berkeley/1742-spruce-street/access-procedure": "## Entry points\n\n**Main building front door** - opens three ways: with the building access code, by buzzing\na unit and having the resident release the door from their intercom panel, or with a key.\n\n**Garage door** - from outside, only with the garage key. From inside, it opens\nautomatically as a car approaches; buttons near parking spot 1 also open, close and stop\nit.\n\nThe main building front door, the garage door and the back stairwell door in parking\nspot 8 all take the **same high-security Schlage key**. See\n[Key handling](/procedures/key-handling.md) - these keys can only be duplicated by\n[Rex Key of Berkeley](/vendors/rex-key-of-berkeley.md), and a full building re-key runs\nroughly $1,000.\n\n## Vertical access\n\n* Front stairwell - ground level to every floor, continuing to the roof.\n* Back stairwell - every floor plus the garage.\n* Elevator - all floors plus the garage.\n\n**Roof.** The key that unlocks the rooftop access door on the fourth floor is kept in the\nbackup key box.\n\n## Backup keys\n\nBackup keys are in the **closet to the left of the elevator, inside the garage**. A grey\nkey lock box and a red key lock box are both recorded at this property, each opened by its\nown combination.\n\nA master lockbox holding a backup key for the garage was placed at the front floor ground\nlevel on **28 October 2024**, for emergencies when the main door cannot be opened. After\nreturning any key to it, confirm the combination has been scrambled and provide a photo as\nproof of return.\n\n## Access points and secret references\n\nNo credential value appears in this bundle. Each access point below resolves through\nAskDwell's Access Broker.\n\n| Access point | Reference |\n| --- | --- |\n| Main building front door code | `secret_ref: physical-access/1742-spruce-street/main-entrance` |\n| Backup key closet door lock | `secret_ref: physical-access/1742-spruce-street/backup-key-closet` |\n| Grey key lock box | `secret_ref: physical-access/1742-spruce-street/grey-key-lockbox` |\n| Red key lock box | `secret_ref: physical-access/1742-spruce-street/red-key-lockbox` |\n| Master lockbox, ground floor | `secret_ref: physical-access/1742-spruce-street/master-lockbox` |\n| Elevator machine room | `secret_ref: physical-access/1742-spruce-street/elevator-room` |\n| Garage key drop-off box, on the wall outside the laundry room | `secret_ref: physical-access/1742-spruce-street/garage-key-dropoff` |\n| Electrical distribution room, between parking 7 and 8 | `secret_ref: physical-access/1742-spruce-street/electrical-room` |\n| Garage closet / water heater room | `secret_ref: physical-access/1742-spruce-street/water-heater-room` |\n| Mailbox combination locks (units 22, 24, 25) | `secret_ref: physical-access/1742-spruce-street/mailbox-combination-locks` |\n\n## Surveillance\n\nThe building has **no** cameras or surveillance equipment.\n\n## Related\n\n* [Tenant lockout procedure](/procedures/tenant-lockout.md)\n* [Key, lockbox and fob handling](/procedures/key-handling.md)\n* [Package delivery access](/procedures/package-delivery-access.md)\n\n## Authorization and secret handling\n\n`sensitivity: restricted` on this concept is **descriptive metadata only**. OKF does not\nenforce authorization, and nothing in this bundle can prevent a consumer from reading a\nfile it can open.\n\n* Access control for this content must be enforced by **AskDwell's Access Broker**, not by\n  this bundle.\n* Protected access values (door codes, gate codes, lockbox and key-box combinations,\n  fob programming credentials, portal logins) are **not stored in this bundle**. Each one\n  is replaced by an opaque `secret_ref` that the Access Broker resolves.\n* The AI model must never receive or reproduce a protected credential. A `secret_ref`\n  is the only thing a model-facing surface may carry; resolution happens in a trusted\n  component after an authorization decision.", "properties/berkeley/1742-spruce-street/amenities": "## Parking\n\n10 spaces at **$150**. Tenants who lease a spot receive a garage key that also opens the\ngarage door key box, the main building front door, and the back stairwell door in parking\nspot 8.\n\nFrom inside, the garage door opens automatically as a car approaches. Buttons near parking\nspot 1 open, close and stop the door.\n\nThe source names a \"1742 Spruce Garage Map\" but records no retrievable URL for it.\n\n## Laundry\n\n* 2 washers, 2 dryers\n* Payment by coin or the [PayRange](/vendors/payrange.md) mobile app\n* Equipment: GE Appliances, model GFQ14ESSN0WW\n* Service contact recorded in the source: 510-253-3656\n\nThere is **no laundry room code** - the garage itself is secured, so the laundry room needs\nnone.\n\nStaff collect the coins here; see\n[Laundry coin collection](/procedures/laundry-coin-collection.md).\n\n## Mail\n\nMailboxes are in the entry area, immediately inside the front door.\n\n* Mailboxes opened by **key**: 11, 21, 23, 24, 31, 32, 33, 34\n* Mailboxes opened by **combination lock**: 22, 24, 25\n\n> **Unresolved contradiction.** Mailbox 24 appears in both lists. Combination values are\n> protected and are not stored in this bundle.\n\n## Garbage\n\nLocated on the **north side** of the building:\n\n* 1 dedicated dumpster for trash\n* 1 dedicated can for cardboard and paper\n* 1 dedicated can for bottles and cans\n* 1 dedicated can for green waste\n\nCollected **Monday and Wednesday mornings**.\n\nCity of Berkeley refuse contact: (510) 981-7270, customerservice@berkeleyca.gov. The city\nrefuse account number is a protected identifier and is not stored in this bundle.\n\n## Common area service\n\n[Community Pro](/vendors/community-pro.md) cleans common areas and maintains the landscape\n**monthly**.\n\n## Elevator\n\n[Paramount Elevator](/vendors/paramount-elevator.md), inspected monthly.\n\n## Related\n\n* [Package delivery access](/procedures/package-delivery-access.md)\n* [Berkeley tenant and city resources](/jurisdictions/california/berkeley/tenant-resources.md)", "properties/berkeley/1742-spruce-street/inspections": "| Inspection | Inspector | Last recorded |\n| --- | --- | --- |\n| Fire safety | City of Berkeley Finance-Treasury Division, 510-981-7200 | Not recorded |\n| Building inspection - units 11, 22, 25, 31, 33 | City of Berkeley | 2023 |\n| Elevator | [Paramount Elevator](/vendors/paramount-elevator.md), with Oakland District Office named alongside | 2023-06 |\n| 3 standpipes, five-year renewal, first floor | [Fire King Fire Protection](/vendors/fire-king-fire-protection.md) | 01/2026 |\n| 1 fire alarm, annual | [Fire King Fire Protection](/vendors/fire-king-fire-protection.md) | 01/2026 |\n| 6 extinguishers, annual | [Best Fire Equipment Company](/vendors/best-fire-equipment.md) | 01/2026 |\n| Sprinklers | N/A | N/A |\n\n## Notes\n\n* No date is recorded for the fire safety inspection at this property.\n* The extinguisher count on this program (6) differs from the counts in\n  [safety systems](/properties/berkeley/1742-spruce-street/safety-systems.md) (stated 4,\n  listed 5). Unresolved.\n* The elevator row names both a vendor and a district office without explaining the\n  division of responsibility.\n\n## Related\n\n* [Safety systems](/properties/berkeley/1742-spruce-street/safety-systems.md)\n* [Berkeley tenant and city resources](/jurisdictions/california/berkeley/tenant-resources.md)", "properties/berkeley/1742-spruce-street/maintenance": "## Repair history\n\n| Work | Year |\n| --- | --- |\n| Smart locks installed | 2023 |\n| Front door electric strike replaced | 2023 |\n| Garage door controller replaced | 2023 |\n| Elevator motor starter contacts replaced (worn), $1,425 | 2023-06 |\n\n## Recurring maintenance\n\n* **Door batteries** - replaced every time a tenant moves out. See\n  [Door battery replacement](/procedures/door-battery-replacement.md).\n* **Red lockbox inspection** - recorded 10/2024.\n* **Backup key inventory in the red lockbox** - recorded 10/2024.\n* **Common areas and landscape** - [Community Pro](/vendors/community-pro.md), monthly.\n* **Elevator** - [Paramount Elevator](/vendors/paramount-elevator.md), monthly.\n\n## Warranty\n\nNo warranty information is recorded for installed items such as HVAC units; the source\nmarks this N/A.\n\n## Equipment locations\n\n| Equipment | Location |\n| --- | --- |\n| Electrical distribution room | Between parking spots 7 and 8 |\n| Garage closet / water heater room | In the garage |\n| Backup key closet | To the left of the elevator, inside the garage |\n| Fire alarm control panel | Lobby |\n| Storage room | Houses the circuit breaker and the PG&E smart meter |\n\nCodes for the electrical room and water heater room are protected; see the\n[access procedure](/properties/berkeley/1742-spruce-street/access-procedure.md).\n\n## Appliances\n\nThe source keeps per-unit and common-area appliance label records. Where a label photo is\nmissing, the source states this means the long-term label application is unclear or\nmissing. No appliance label images carry a retrievable URL in the source.\n\n## Related\n\n* [Inspections](/properties/berkeley/1742-spruce-street/inspections.md)", "properties/berkeley/1742-spruce-street/property": "| Attribute | Value |\n| --- | --- |\n| Address | 1742 Spruce Street, Berkeley, California |\n| Units | 10 |\n| Year built | 1965 |\n| Amenities | Secure parking, on-site laundry, elevator, balconies/patios on most units |\n| Parking spaces | 10, at $150 |\n\n## Structure\n\nTwo stairwells. The **front** stairwell runs from ground level to every floor and\ncontinues to the roof. The **back** stairwell serves every floor and also reaches the\ngarage. An **elevator** serves all floors and the garage.\n\nThe building is entered two ways: the main building front door, and the garage door.\nDetails are in the [access procedure](/properties/berkeley/1742-spruce-street/access-procedure.md).\n\n## Units\n\nTen units across three residential floors, numbered by floor: 11 on the first, 21-25 on\nthe second, 31-34 on the third. Sizes run from a studio to a three-bedroom.\nSee [units](/properties/berkeley/1742-spruce-street/units/index.md).\n\n## Applicable jurisdiction\n\nBerkeley, California. See\n[Berkeley](/jurisdictions/california/berkeley/index.md) and\n[California](/jurisdictions/california/index.md).\n\n## Related\n\n* [Utilities](/properties/berkeley/1742-spruce-street/utilities.md)\n* [Amenities](/properties/berkeley/1742-spruce-street/amenities.md)\n* [Safety systems](/properties/berkeley/1742-spruce-street/safety-systems.md)\n* [Maintenance](/properties/berkeley/1742-spruce-street/maintenance.md)\n* [Inspections](/properties/berkeley/1742-spruce-street/inspections.md)", "properties/berkeley/1742-spruce-street/safety-systems": "## Fire alarm\n\nThe building has a fire alarm system with **pull handles on each floor** and in the garage\nnear the laundry room. The **main control panel is in the lobby**.\n\n## Standpipe and hoses\n\nThe building uses a **dry standpipe** system. The hoses inside the building carry no water\nuntil the fire department connects the standpipe inlet in the building entry area to a\nwater supply. Anyone planning around these hoses needs to know that - they are not a\nusable water source on their own.\n\nThree fire hoses:\n\n* Spruce 22, downstairs outside patio\n* Floor 2 - middle of the building\n* Floor 3 - middle of the building\n\nThere is also a hose connection point on the roof, outside the stairwell.\n\n## Fire extinguishers\n\nThe source states there are **4** extinguishers, then lists **5** locations:\n\n* Garage - next to the laundry room\n* 1st floor - stairwell\n* 2nd floor - stairwell\n* 3rd floor - stairwell\n* Elevator room - in the basement\n\nThe [inspection program](/properties/berkeley/1742-spruce-street/inspections.md) records\n**6** extinguishers on the annual service. Three different counts appear in the source;\nnone is treated as authoritative here. Recorded in the conversion review reports.\n\n## Sprinklers\n\nNone recorded - the inspection program marks sprinklers N/A.\n\n## Related\n\n* [Inspection program](/properties/berkeley/1742-spruce-street/inspections.md)\n* [Fire King Fire Protection](/vendors/fire-king-f
